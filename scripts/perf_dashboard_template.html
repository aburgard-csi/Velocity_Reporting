<title>RPE Client Performance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* The Sheila Hub's frame and colors (Aaron, 2026-11-02): a glass sidebar that folds to a rail, a bottom bar on
   phones, KPI tiles, dense rows. Hub colors only: ground, navy, teal; no orange. Program colors are the four
   validated with the dataviz script (light on #FFFFFF, dark on #141D38); every program name sits beside its dot. */
:root{
  --display:Montserrat,"Segoe UI",system-ui,sans-serif;
  --body:Carlito,Calibri,"Segoe UI",system-ui,sans-serif;
  --ground:#EDF1F7; --glow-a:rgba(21,98,126,.13); --glow-b:rgba(91,192,222,.26);
  --surface:rgba(255,255,255,.74); --sheet:#FFFFFF; --fill:#E4EAF3; --line:#C6D1E0;
  --glass:rgba(255,255,255,.62); --glass-line:rgba(58,80,107,.22); --glass-hi:rgba(58,80,107,.12);
  --ink:#0B132B; --muted:#4A5C75; --navy:#1C2541;
  --accent:#15627E; --accent-ink:#15627E; --accent-soft:rgba(21,98,126,.12); --on-accent:#FFFFFF;
  --good:#15627E; --good-soft:#D9EFF6; --warn:#6E4A12; --warn-soft:#F8EBD8; --bad:#8F2D0B; --bad-soft:#FAE3D8;
  --c-ars:#2F5FB5; --c-ics:#B5476B; --c-mrpc:#9A7B10; --c-cp:#8F4FB0;
  --shadow:0 1px 2px rgba(11,19,43,.05),0 14px 30px -24px rgba(11,19,43,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0B132B; --glow-a:rgba(91,192,222,.15); --glow-b:rgba(91,192,222,.17);
    --surface:rgba(28,37,65,.66); --sheet:#141D38; --fill:#28344F; --line:#3A506B;
    --glass:rgba(28,37,65,.55); --glass-line:rgba(159,176,199,.24); --glass-hi:rgba(244,247,251,.1);
    --ink:#EEF3FA; --muted:#A3B3C9; --navy:#EEF3FA;
    --accent:#5BC0DE; --accent-ink:#5BC0DE; --accent-soft:rgba(91,192,222,.18); --on-accent:#0B132B;
    --good:#5BC0DE; --good-soft:#17324B; --warn:#F4D6B0; --warn-soft:#352F2B; --bad:#F59A78; --bad-soft:#3A241C;
    --c-ars:#5F86DB; --c-ics:#D0608F; --c-mrpc:#AB8A22; --c-cp:#A06CD0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 34px -24px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0B132B; --glow-a:rgba(91,192,222,.15); --glow-b:rgba(91,192,222,.17);
  --surface:rgba(28,37,65,.66); --sheet:#141D38; --fill:#28344F; --line:#3A506B;
  --glass:rgba(28,37,65,.55); --glass-line:rgba(159,176,199,.24); --glass-hi:rgba(244,247,251,.1);
  --ink:#EEF3FA; --muted:#A3B3C9; --navy:#EEF3FA;
  --accent:#5BC0DE; --accent-ink:#5BC0DE; --accent-soft:rgba(91,192,222,.18); --on-accent:#0B132B;
  --good:#5BC0DE; --good-soft:#17324B; --warn:#F4D6B0; --warn-soft:#352F2B; --bad:#F59A78; --bad-soft:#3A241C;
  --c-ars:#5F86DB; --c-ics:#D0608F; --c-mrpc:#AB8A22; --c-cp:#A06CD0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 34px -24px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(38rem 26rem at 8% 14%,var(--glow-a),transparent 70%),radial-gradient(44rem 30rem at 96% 4%,var(--glow-b),transparent 70%)}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
button{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.app{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start;max-width:1560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px}

/* ---- sidebar ---- */
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));width:236px;display:flex;flex-direction:column;gap:6px;
  padding:14px 12px;border-radius:28px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);transition:width .22s ease}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 8px;position:relative}
.mark{flex:none;width:40px;height:40px}
.brand b{display:block;font:700 15px/1.15 var(--display)}
.brand small{display:block;font-size:13px;color:var(--muted)}
.fold{position:absolute;right:-24px;top:9px;width:28px;height:28px;border-radius:50%;border:1px solid var(--glass-line);background:var(--sheet);display:grid;place-items:center;cursor:pointer;padding:0}
.fold::after{content:"";position:absolute;inset:-8px}
.fold svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.sec{font-size:13px;color:var(--muted);padding:10px 10px 3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nl{position:relative;display:flex;align-items:center;gap:11px;min-height:44px;padding:0 11px;border-radius:999px;color:var(--ink);text-decoration:none;font-size:15.5px;border:1px solid transparent;background:none;cursor:pointer;width:100%;text-align:left}
.nl svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nl .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);margin:0 5px}
.nl:hover{background:var(--glass-hi)}
.nl[aria-current="page"]{background:var(--glass-hi);border-color:var(--glass-line);font-weight:700}
.badge{margin-left:auto;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--fill);font-size:12.5px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.badge.hot{background:var(--accent);color:var(--on-accent)}
.badge:empty{display:none}
.app.rail .side{width:70px}
.app.rail .brand b,.app.rail .brand small,.app.rail .sec,.app.rail .lbl{display:none}
.app.rail .nl{justify-content:center;padding-inline:0}
.app.rail .brand{justify-content:center;padding-inline:0}
.app.rail .fold svg{transform:rotate(180deg)}
.app.rail .badge{position:absolute;top:3px;right:3px;min-width:10px;width:10px;height:10px;padding:0;font-size:0;margin:0}

/* ---- top bar and view ---- */
main{min-width:0;display:flex;flex-direction:column;gap:18px;padding-top:4px}
.bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:8px 8px 8px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.find{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-height:40px;padding:0 12px;border-radius:999px;background:var(--fill);border:1px solid transparent;color:var(--muted)}
.find:focus-within{border-color:var(--accent-ink)}
.find svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.find input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;outline:0}
.find kbd{font:12px var(--body);padding:1px 7px;border-radius:6px;border:1px solid var(--line);background:var(--sheet);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--glass-line);background:none;cursor:pointer;font-size:14.5px}
.btn:hover{background:var(--glass-hi)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.view{display:flex;flex-direction:column;gap:18px;min-width:0}
.vh{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.vh h1{font:700 30px/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.vh p{margin:6px 0 0;color:var(--muted);max-width:72ch}
.eyebrow{font-size:13px;color:var(--muted);margin-bottom:2px}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 13px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:13.5px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--fill);color:var(--ink);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.soft{font-weight:400;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpis[data-n="6"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:3px;padding:15px 16px 14px;border-radius:16px;border:1px solid var(--glass-line);background:var(--surface);box-shadow:var(--shadow);min-width:0;text-align:left;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);text-decoration:none;color:inherit}
a.kpi{cursor:pointer} a.kpi:hover{border-color:var(--muted)}
.kpi .k{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted)}
.kpi .k i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.kpi .v{font:700 28px/1.15 var(--display);font-variant-numeric:lining-nums tabular-nums}
.kpi .n{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--glass-line);border-radius:18px;box-shadow:var(--shadow);min-width:0;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card>header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.card h2{margin:0;font:700 17px var(--display);flex:1 1 12rem;min-width:0}
.card .sub{margin:0;font-size:13.5px;color:var(--muted);flex-basis:100%}
.card .pad{padding:6px 18px 16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
.seg{display:flex;gap:2px;padding:2px;border-radius:999px;background:var(--fill)}
.seg button{border:0;background:none;min-height:36px;padding:0 13px;border-radius:999px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--sheet);font-weight:700;box-shadow:0 1px 2px rgba(11,19,43,.2)}
.sel{font:inherit;font-size:14.5px;color:var(--ink);background:var(--fill);border:1px solid transparent;border-radius:999px;min-height:40px;padding:0 14px;cursor:pointer}
.sel:focus-visible{outline:2px solid var(--accent-ink)}

/* ---- needs a look ---- */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:52px;padding:6px 18px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li b{font-weight:700}
.li .t{min-width:0}
.li .idn{color:var(--muted);font-size:13.5px;margin-left:4px}
.li .m{display:block;font-style:normal;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.li a{font-size:14.5px;white-space:nowrap}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.warn{color:var(--warn)} .ic.bad{color:var(--bad)} .ic.ok{color:var(--good)} .ic.unk{color:var(--muted)}
.more{display:block;width:100%;min-height:44px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;color:var(--accent-ink);font-weight:700}

/* ---- ranked bars ---- */
.bars{display:grid;grid-template-columns:minmax(96px,auto) minmax(0,1fr) auto;column-gap:12px;row-gap:9px;align-items:center;font-variant-numeric:tabular-nums}
.bars .hit{display:contents}
.bars .nm{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.bars .tr{height:10px;background:var(--fill);border-radius:5px;position:relative}
.bars .bar{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:0 5px 5px 0;min-width:3px}
.bars .bar.neg{background:var(--bad)}
.bars .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.7}
.bars .vl{font-size:14px;color:var(--muted);white-space:nowrap;min-width:4.5em;text-align:right}
.bars .hit:hover .nm{font-weight:700}
.bars .hit:hover .tr{outline:2px solid var(--glass-hi)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:13px}
.legend b{display:inline-block;width:12px;height:9px;border-radius:2px;background:var(--c);vertical-align:middle;margin-right:6px}
.legend i{display:inline-block;width:2px;height:12px;background:var(--ink);opacity:.7;vertical-align:middle;margin-right:6px}

/* ---- trend chart ---- */
.trend{display:block;width:100%;height:auto;max-height:300px}
.trend .gl{stroke:var(--line);stroke-width:1}
.trend text{fill:var(--muted);font:13.5px var(--body);font-variant-numeric:tabular-nums}
.trend .ln{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.trend .ar{fill:var(--c);opacity:.12}
.trend .goal{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.trend .end{fill:var(--c);stroke:var(--sheet);stroke-width:2}
.trend .xh{stroke:var(--muted);stroke-width:1;opacity:0}
.trend .hot{fill:var(--c);stroke:var(--sheet);stroke-width:2;opacity:0}
.trend .lab{fill:var(--ink);font-weight:700}

/* ---- tables ---- */
.tbl{overflow-x:auto;padding:0 8px 12px}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th{font-size:12.5px;font-weight:700;color:var(--muted);text-align:right;padding:10px 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
th.l,td.l{text-align:left}
td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle;min-height:40px}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--glass-hi)}
td .cl{font-weight:700}
td .id{color:var(--muted);font-size:13px;margin-left:6px}
td .sub{display:block;color:var(--muted);font-size:13px}
td.dim,td .dim{color:var(--muted)}
td .neg{color:var(--bad)}
th.sortable{padding:0}
th.sortable button{appearance:none;background:none;border:0;margin:0;width:100%;font:inherit;color:inherit;text-align:inherit;cursor:pointer;padding:10px 10px 8px;display:block;min-height:44px}
th.sortable button:hover{color:var(--ink)}
th.sortable .arr{font-size:10px;opacity:.45;margin-left:4px}
th.sortable[aria-sort="ascending"] button,th.sortable[aria-sort="descending"] button{color:var(--ink)}
th.sortable[aria-sort="ascending"] .arr,th.sortable[aria-sort="descending"] .arr{opacity:1;color:var(--accent-ink)}
.rdy th.sortable button{text-align:left}
.peer td{background:var(--fill);color:var(--muted)}
.peer td .cl{font-weight:700;color:var(--muted)}
.av{display:block;font-size:13px;line-height:1.5;white-space:nowrap}
.av code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--fill);padding:0 5px;border-radius:5px}
.empty{padding:22px 18px;color:var(--muted)}
.spark{display:block;width:120px;height:32px}
.spark path.ln{fill:none;stroke:var(--c);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.spark path.ar{fill:var(--c);opacity:.12}
.spark path.gl{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.spark circle{fill:var(--c)}
.spark circle.pt{fill:var(--sheet);stroke:var(--c);stroke-width:1.5}
.spark rect.hit{fill:transparent}

/* ---- roster ---- */
.st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-weight:700}
.st .ic{width:20px;height:20px}
.need{display:block;color:var(--muted);font-size:13px;white-space:normal;font-weight:400}
.ins{display:flex;flex-wrap:wrap;gap:5px;white-space:normal}
.in{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:1px 9px;border-radius:999px;background:var(--fill);white-space:nowrap}
.in i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.in.miss{background:var(--bad-soft);color:var(--bad)} .in.stale{background:var(--warn-soft);color:var(--warn)}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.dots i.off{background:var(--fill)}
.tagbtn{cursor:pointer;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--accent-ink);background:none;color:var(--accent-ink);font-size:13.5px;font-weight:700}
.tagbtn:hover{background:var(--accent);color:var(--on-accent)}
.tagbtn[disabled]{cursor:default;border-color:var(--line);color:var(--muted);background:var(--fill)}
.tagbtn.good{border-color:var(--good);color:var(--good)} .tagbtn.good:hover{background:var(--good);color:var(--on-accent)}
.tagbtn.confirm,.tagbtn.confirm:hover{background:var(--bad);border-color:var(--bad);color:#fff}
.skel{display:inline-block;width:92px;height:22px;border-radius:999px;background:linear-gradient(90deg,var(--fill),var(--glass-hi),var(--fill));background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.rp{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}

/* ---- tooltip, toast ---- */
#tip{position:fixed;pointer-events:none;z-index:70;background:var(--sheet);color:var(--ink);border:1px solid var(--glass-line);font-size:13.5px;line-height:1.35;padding:8px 11px;border-radius:10px;box-shadow:var(--shadow);max-width:290px;opacity:0;transition:opacity .08s;font-variant-numeric:tabular-nums}
#tip.on{opacity:1}
#tip b{display:block;font:700 13px var(--display);margin-bottom:2px}
#note{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--navy);color:var(--ground);font-size:14px;padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:min(520px,88vw);opacity:0;pointer-events:none;transition:opacity .15s}
#note.on{opacity:1}

/* ---- Live Review commands (Aaron, 2026-11-03) ---- */
#lrbox{width:min(720px,calc(100vw - 32px));border:1px solid var(--glass-line);border-radius:20px;background:var(--sheet);color:var(--ink);padding:18px;box-shadow:var(--shadow)}
#lrbox::backdrop{background:rgba(11,19,43,.5)}
#lrbox h3{margin:0 0 4px;font:700 17px var(--display)}
#lrbox p{margin:0 0 10px;color:var(--muted);font-size:14px}
#lrbox textarea{width:100%;height:240px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:var(--fill);color:var(--ink);padding:10px;font:13px/1.45 Consolas,Menlo,monospace}
#lrbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}

/* ---- sources ---- */
details.src{border-radius:18px;border:1px solid var(--glass-line);background:var(--surface);padding:6px 18px}
details.src summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font:700 15px var(--display)}
details.src ul{margin:4px 0 12px;padding-left:18px;color:var(--muted);font-size:14px}
details.src li{margin:5px 0}
details.src li b{color:var(--ink)}

/* ---- phone: bottom bar ---- */
.bottom{display:none}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1100px){.kpis[data-n="6"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:0;padding-block:10px 96px}
  .side{display:none}
  .bottom{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:60;gap:2px;padding:6px;border-radius:26px;
    background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  .bottom button{flex:1;min-width:0;min-height:48px;border:0;background:none;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11.5px;cursor:pointer}

<script>
const DATA = __DATA__;
const PROGS = [
  {k:"ARS", name:"Account Revenue Solution", short:"ARS", c:"var(--c-ars)", hash:"ars"},
  {k:"ICS", name:"Invitation Checking System", short:"ICS", c:"var(--c-ics)", hash:"ics"},
  {k:"MRPC", name:"MyRewards Premium Cards", short:"MRPC", c:"var(--c-mrpc)", hash:"mrpc"},
  {k:"CP", name:"CashPlease", short:"CashPlease", c:"var(--c-cp)", hash:"cp"},
];
const PK = Object.fromEntries(PROGS.map(p=>[p.k,p]));
const clients = DATA.clients;
const SCOPE = DATA.scope || {csm:"", clients:clients.length, programs:{}};

// ---------- sent state
// deliveries.json is the record, and DATA carries it. A click here writes a row
// to this artifact's own store instead of guessing: the morning refresh folds
// those rows into deliveries.json, so the page never becomes a second ledger.
// Sent is keyed on the DECK's period, not the cycle's - the same key the log uses.
let DB = null;            // db namespace once it resolves; null = this view cannot write
let DBSTATE = "pending";  // pending until the store answers or is known to be absent
let MARKS = new Map();    // docId -> row recorded from the page (a send, or an undo)
const BUSY = new Set();   // docId mid-write
let ARMED = null;         // docId whose sent date was clicked once and awaits the confirming click
let armTimer = null;
const ARM_MS = 5000;

function today(){ const d=new Date(), p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }

// ---------- the Build readiness period
// The section shows ONE period at a time: its readiness, the decks built FOR it, and the
// sends recorded AGAINST it. Switching the period swaps all three, so the Sent column
// starts clean for the period chosen, and a send marked here is recorded against the period showing.
// The choice is shared: it lives in the artifact's store so every viewer sees the same period,
// with this browser's last choice as the fallback for a saved copy.
const RPERIODS = (DATA.readiness_periods && DATA.readiness_periods.length) ? DATA.readiness_periods : [DATA.period];
const RPERIOD_KEY = "rpe-dash-rperiod";
let rPeriod = RPERIODS.includes(DATA.period) ? DATA.period : RPERIODS[RPERIODS.length-1];
try { const s = localStorage.getItem(RPERIOD_KEY); if (s && RPERIODS.includes(s)) rPeriod = s; } catch(e){}
function rv(c){
  // The client as the selected period sees it. Data built before the per-period view
  // existed carries only the cycle period, so that case falls back to the flat fields.
  const P = rPeriod, bp = (c.by_period && c.by_period[P]) || null;
  const decks = bp ? (bp.decks || []) : (c.deck_period===P ? (c.decks || []) : []);
  const sent = bp ? (bp.sent || null) : (c.deck_period===P ? (c.sent || null) : null);
  const readiness = (c.readiness_by_period && (P in c.readiness_by_period)) ? c.readiness_by_period[P]
                    : (P===DATA.period ? c.readiness : null);
  return {P, decks, sent, readiness, built: decks.length > 0};
}
async function setRPeriod(p, fromStore){
  if (!RPERIODS.includes(p) || p === rPeriod) return;
  rPeriod = p; disarm();
  try { localStorage.setItem(RPERIOD_KEY, p); } catch(e){}
  update();
  if (fromStore || !DB) return;
  try { await DB.doc("settings/readiness_period").set({period:p, set_at:new Date().toISOString(), by:"artifact page"}); }
  catch (err) { note(`The period shows here but could not be shared with other viewers. ${whyFailed(err)}`); }
}
document.addEventListener("change", e => { if (e.target && e.target.id === "rperiod") setRPeriod(e.target.value); });

// Sent is keyed on the period SHOWING, not the cycle's - the same key the log uses.
const sentDoc = c => `${c.id}-${rPeriod}`;
// A page row that names the logged date it supersedes ("undo_of") overrides that date:
// an undo row clears it, a send row replaces it. A row naming any OTHER date is stale
// and the log stands - the refresh applies exactly the same rule to deliveries.json.
function sentState(c){
  const v = rv(c), k = sentDoc(c), m = MARKS.get(k) || null;
  const supersedes = !!(m && v.sent && m.undo_of != null && String(m.undo_of) === String(v.sent));
  if (v.sent && !supersedes) return {date:String(v.sent), src:"log"};
  if (m && !m.unsent && m.sent_at) return {date:String(m.sent_at), src:"page"};
  return null;
}
function disarm(){
  clearTimeout(armTimer); armTimer = null;
  if (ARMED !== null){ ARMED = null; update(); }
}
function refocus(attr, id){
  const el = [...document.querySelectorAll(`[${attr}]`)].find(b => b.getAttribute(attr) === id);
  if (el) el.focus();
}

let noteTimer = null;
function note(msg){
  const n = document.getElementById("note");
  n.textContent = msg; n.classList.add("on");
  clearTimeout(noteTimer); noteTimer = setTimeout(()=>n.classList.remove("on"), 6000);
}
function whyFailed(err){
  switch (err && err.code){
    case "not_granted": case "capability_disabled": case "capability_removed":
      return "This view cannot record sends.";
    case "invalid_argument": return "The record was rejected as malformed.";
    case "resource_exhausted": return "Too many writes at once \u2014 wait a moment and click again.";
    case "quota_exceeded": return "The page's store is full.";
    case "revoked": return "Access was withdrawn \u2014 reload the page.";
    case "unavailable": return "The store is briefly unreachable \u2014 click again.";
    default: return "Nothing was recorded.";
  }
}

function sentCell(c){
  const s = sentState(c), k = sentDoc(c);
  if (k && BUSY.has(k)) return `<button class="tagbtn" disabled>saving\u2026</button>`;
  if (DBSTATE === "pending" && !s) return `<span class="skel" aria-label="loading sent records"></span>`;
  if (s){
    if (!DB) return `<span class="chip good">sent ${esc(s.date)}</span>`;
    if (ARMED === k) return `<button class="tagbtn confirm" data-unsend="${esc(k)}" ` +
      `title="Click again to remove the ${esc(s.date)} send record. Click anywhere else or press Esc to keep it.">Undo send?</button>`;
    return `<button class="tagbtn good" data-unsend="${esc(k)}" ` +
      `title="Sent ${esc(s.date)} \u2014 click to undo">sent ${esc(s.date)}</button>`;
  }
  const v = rv(c);
  if (!v.built) return `<span class="chip soft" title="no deck has been built for this client for ${esc(v.P)}">not recorded</span>`;
  if (!DB) return `<span class="chip soft">not recorded</span>`;
  return `<button class="tagbtn" data-mark="${esc(k)}" title="Not recorded \u2014 click to record the ${esc(v.P)} deck as sent today">Mark sent</button>`;
}

document.addEventListener("keydown", e => { if (e.key === "Escape" && ARMED !== null) disarm(); });

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-mark],[data-unsend]");
  if (!el){ if (ARMED !== null) disarm(); return; }
  if (!DB) return;
  const id = el.dataset.mark || el.dataset.unsend, marking = !!el.dataset.mark;
  const c = clients.find(x => sentDoc(x) === id);
  if (!c || BUSY.has(id)) return;

  // Undo takes two clicks. The first only arms the button - nothing is written - and it
  // disarms on its own after ARM_MS, on Esc, or on a click anywhere else.
  if (!marking && ARMED !== id){
    clearTimeout(armTimer);
    ARMED = id; update(); refocus("data-unsend", id);
    armTimer = setTimeout(disarm, ARM_MS);
    return;
  }
  const s = sentState(c), v = rv(c);
  clearTimeout(armTimer); armTimer = null; ARMED = null;
  BUSY.add(id); update();
  // Recorded against the period SHOWING, with the deck built for it.
  const stamp = {client_id:c.id, period:v.P, deck:v.decks[0] || "",
                 by:"artifact page", recorded_at:new Date().toISOString()};
  try {
    let row;
    if (marking){
      row = Object.assign({sent_at:today()}, stamp);
      // Marking over a logged date that was undone: name that date, so the refresh
      // replaces it rather than keeping the old one because an entry already exists.
      if (v.sent) row.undo_of = String(v.sent);
      await DB.doc("deliveries/"+id).set(row);
      note(`${c.name} recorded as sent ${row.sent_at} for ${v.P}.`);
    } else {
      // An undo is a row, not a deletion: the send may already be in deliveries.json,
      // which only the refresh can change. It names the date it cancels - the logged date
      // when there is one - so it can never remove a send recorded after it.
      const was = String(v.sent || (s && s.date) || "");
      row = Object.assign({unsent:true, undo_of:was}, stamp);
      await DB.doc("deliveries/"+id).set(row);
      note(`${c.name}: the ${was} send record is removed.`);
    }
    MARKS.set(id, row);
  } catch (err) {
    note(`${marking ? "Could not record" : "Could not undo"} ${c.name}. ${whyFailed(err)}`);
  } finally {
    BUSY.delete(id); update();
    refocus(marking ? "data-unsend" : "data-mark", id);
  }
});

(async function initDb(){
  const use = (typeof window !== "undefined" && window.claude && window.claude.use);
  if (typeof use !== "function"){ DBSTATE = "none"; return; }   // saved copy or plain host: read-only
  let db = null;
  try { db = await window.claude.use("db"); } catch(e){ db = null; }
  if (!db){ DBSTATE = "none"; update(); return; }              // not granted / not served: read-only
  DB = db; DBSTATE = "ready";
  try {
    db.collection("deliveries").onSnapshot(
      snap => { MARKS = new Map(snap.docs.filter(d=>d.exists).map(d => [d.id, d.data()||{}]));
                update(); },
      err  => note(`Sent records could not be loaded (${(err&&err.code)||"unknown"}); what you see may be out of date.`)
    );
  } catch(e){ /* no live updates; the buttons still write */ }
  try {
    // The shared Build readiness period: whoever changed it last, every viewer follows.
    db.collection("settings").onSnapshot(
      snap => { const d = snap.docs.find(x => x.id === "readiness_period" && x.exists);
                const p = d && (d.data()||{}).period;
                if (p && RPERIODS.includes(p)) setRPeriod(p, true); },
      ()   => {}                                    // no shared period: this viewer's own stands
    );
  } catch(e){ /* the picker still works for this viewer */ }
  update();                                        // reveal the buttons
})();

// ---------- formatters
const nf0 = new Intl.NumberFormat("en-US",{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat("en-US",{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const N = v => v==null||isNaN(v) ? "\u2014" : nf0.format(v);
const N1 = v => v==null||isNaN(v) ? "\u2014" : nf1.format(v);
const USD = v => v==null||isNaN(v) ? "\u2014" : (v<0?"\u2212":"")+"$"+nf0.format(Math.abs(v));
const USDk = v => { if(v==null||isNaN(v)) return "\u2014"; const a=Math.abs(v), s=v<0?"\u2212":""; if(a>=1e6) return s+"$"+nf2.format(a/1e6).replace(/\.?0+$/,"")+"M"; if(a>=1e4) return s+"$"+nf0.format(a/1e3)+"K"; return s+"$"+nf0.format(a); };
const PCT = (v,d=1) => v==null||isNaN(v) ? "\u2014" : new Intl.NumberFormat("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}).format(v)+"%";
const PCTf = (v,d=1) => v==null||isNaN(v) ? "\u2014" : PCT(v*100,d);
const monLabel = m => { // "2026-08" -> "Aug '26"
  if(!m) return ""; const [y,mm]=m.split("-"); const names=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return names[+mm-1]+" \u2019"+y.slice(2); };
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum = (arr,f) => arr.reduce((a,c)=>a+(f(c)||0),0);

// ---------- icons (drawn here; the page loads no icon font)
const IC = {
  grid:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
  list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
  book:'<path d="M5 5a2 2 0 012-2h11v16H7a2 2 0 00-2 2z"/><path d="M5 19a2 2 0 012-2h11"/>',
  more:'<path d="M5 12h.01M12 12h.01M19 12h.01"/>',
  ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/>',
  no:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
  unk:'<circle cx="12" cy="12" r="9"/>',
  moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
};
const ico = (k, cls="") => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

// ---------- tooltip
const tip = document.getElementById("tip");
function showTip(html, e){ tip.innerHTML = html; tip.classList.add("on"); moveTip(e); }
function moveTip(e){ const x=e.clientX, y=e.clientY; const w=tip.offsetWidth, h=tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(x+14, window.innerWidth-w-8))+"px"; tip.style.top = (y+16+h>window.innerHeight? y-h-10 : y+16)+"px"; }
function hideTip(){ tip.classList.remove("on"); }
document.addEventListener("mouseover", e=>{ const t=e.target.closest("[data-tip]"); if(t) showTip(t.dataset.tip, e); });
document.addEventListener("mousemove", e=>{ if(tip.classList.contains("on")) moveTip(e); });
document.addEventListener("mouseout", e=>{ const t=e.target.closest("[data-tip]"); if(t && !t.contains(e.relatedTarget)) hideTip(); });

// ---------- sparkline (SVG)
function spark(series, opts={}){
  // series: [{label, v}], opts: {c, goal:[..], partialLast}
  const vals = series.map(s=>s.v).filter(v=>v!=null);
  if(!vals.length) return `<span class="dim">\u2014</span>`;
  const W=120,H=32,px=3,py=4; const n=series.length;
  const gvals = opts.goal ? opts.goal.filter(v=>v!=null) : [];
  const max = Math.max(...vals, ...gvals, 1), min = Math.min(0, ...vals);
  const x = i => n===1 ? W/2 : px + i*(W-2*px)/(n-1);
  const y = v => H-py - (v-min)/(max-min||1)*(H-2*py);
  let d="", area="";
  series.forEach((s,i)=>{ if(s.v==null) return; d += (d?" L":"M")+x(i).toFixed(1)+" "+y(s.v).toFixed(1); });
  const first = series.findIndex(s=>s.v!=null), last = n-1-[...series].reverse().findIndex(s=>s.v!=null);
  area = d + ` L${x(last).toFixed(1)} ${y(min).toFixed(1)} L${x(first).toFixed(1)} ${y(min).toFixed(1)} Z`;
  let g="";
  if(opts.goal){ let gd=""; opts.goal.forEach((v,i)=>{ if(v==null) return; gd += (gd?" L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1); }); g=`<path class="gl" d="${gd}"/>`; }
  const lastV = series[last].v;
  const end = `<circle class="${opts.partialLast?'pt':''}" cx="${x(last).toFixed(1)}" cy="${y(lastV).toFixed(1)}" r="2.6"/>`;
  const step = n>1 ? (W-2*px)/(n-1) : W-2*px;
  const hits = series.map((s,i)=> s.v==null?"" : `<rect class="hit" x="${(x(i)-step/2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${H}" data-tip="<b>${esc(s.label)}</b>${esc(opts.fmt?opts.fmt(s.v):N(s.v))}${opts.goal&&opts.goal[i]!=null?' \u00b7 goal '+esc(N(opts.goal[i])):''}${s.note?'<br>'+esc(s.note):''}"/>`).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" style="--c:${opts.c}" role="img" aria-label="${esc(opts.aria||'trend')}"><path class="ar" d="${area}"/>${g}<path class="ln" d="${d}"/>${end}${hits}</svg>`;
}

// ---------- ranked bars
let rankMode = {};   // per program: "chart" or "table"
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10, Math.floor(Math.log10(v))); const m=v/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; }
function bars(rows, opts={}){
  // rows: [{name, id, v, tipHtml, marker?}] ; opts: {c, fmt, max}
  const valid = rows.filter(r=>r.v!=null);
  if(!valid.length) return `<div class="empty">No figures for the clients shown.</div>`;
  const max = opts.max ?? Math.max(...valid.map(r=>Math.abs(r.v)), ...(valid.map(r=>r.marker??0)));
  return `<div class="bars" style="--c:${opts.c}">` + valid.sort((a,b)=>b.v-a.v).map(r=>{
    const w = Math.max(0, Math.abs(r.v)/(max||1)*100);
    const mk = r.marker!=null ? `<span class="mk" style="left:${(r.marker/(max||1)*100).toFixed(1)}%"></span>` : "";
    return `<div class="hit" data-tip="${esc(r.tipHtml||'')}"><span class="nm">${esc(r.name)}</span><span class="tr"><span class="bar ${r.v<0?'neg':''}" style="width:${w.toFixed(1)}%"></span>${mk}</span><span class="vl">${opts.fmt(r.v)}</span></div>`;
  }).join("") + `</div>`;
}
function rankTable(rows, opts){
  const valid = rows.filter(r=>r.v!=null).sort((a,b)=>b.v-a.v);
  if(!valid.length) return `<div class="empty">No figures for the clients shown.</div>`;
  return `<div class="tbl" style="padding:0"><table><thead><tr><th class="l">Client</th><th>${esc(opts.label||"Value")}</th></tr></thead><tbody>` +
    valid.map(r=>`<tr><td class="l"><span class="cl">${esc(r.name)}</span><span class="id">${esc(r.id||"")}</span></td><td>${opts.fmt(r.v)}</td></tr>`).join("") + `</tbody></table></div>`;
}
function rankCard(p, title, cap, rows, opts){
  const mode = rankMode[p.k] || "chart";
  const body = mode === "table" ? rankTable(rows, opts) : bars(rows, opts) + (opts.legend || "");
  return `<section class="card"><header><h2>${esc(title)}</h2>` +
    `<div class="seg" role="group" aria-label="View as"><button type="button" data-rank="${p.k}:chart" aria-pressed="${mode!=="table"}">Chart</button><button type="button" data-rank="${p.k}:table" aria-pressed="${mode==="table"}">Table</button></div>` +
    `<p class="sub">${cap}</p></header><div class="pad">${body}</div></section>`;
}

// ---------- trend chart (SVG, drawn to the data)
// series: [{name, c, vals:[..], dash?}], labels: [..]; the first series is the area line.
function trendChart(id, labels, series, opts={}){
  if(!labels.length) return `<div class="empty">No monthly series for the clients shown.</div>`;
  const W=640, H=260, L=52, R=74, T=18, B=32, n=labels.length;
  const all = series.flatMap(s=>s.vals.filter(v=>v!=null));
  const top = niceMax(Math.max(...all, 1)), min = 0;
  const x = i => n===1 ? (L+W-R)/2 : L + i*(W-L-R)/(n-1);
  const y = v => T + (H-T-B) * (1 - (v-min)/(top-min||1));
  const fmt = opts.fmt || N;
  let g = "";
  for(let k=0;k<=4;k++){ const v = top*k/4, yy = y(v).toFixed(1);
    g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-8}" y="${(+yy+4).toFixed(1)}" text-anchor="end">${esc(opts.tick ? opts.tick(v) : fmt(v))}</text>`; }
  const every = Math.ceil(n/6);
  labels.forEach((lb,i)=>{ if((n-1-i)%every===0) g += `<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(lb)}</text>`; });
  let body = "";
  series.forEach((s,si)=>{
    let d=""; s.vals.forEach((v,i)=>{ if(v==null) return; d += (d?" L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1); });
    if(!d) return;
    if(si===0){
      const idx = s.vals.map((v,i)=>v==null?-1:i).filter(i=>i>=0), a = idx[0], z = idx[idx.length-1];
      body += `<path class="ar" style="--c:${s.c}" d="${d} L${x(z).toFixed(1)} ${y(0).toFixed(1)} L${x(a).toFixed(1)} ${y(0).toFixed(1)} Z"/>`;
      body += `<path class="ln" style="--c:${s.c}" d="${d}"/>`;
      body += `<circle class="end" style="--c:${s.c}" cx="${x(z).toFixed(1)}" cy="${y(s.vals[z]).toFixed(1)}" r="4.5"/>`;
      body += `<text class="lab" x="${(x(z)+9).toFixed(1)}" y="${(y(s.vals[z])+4).toFixed(1)}">${esc(fmt(s.vals[z]))}</text>`;
    } else body += `<path class="goal" d="${d}"/>`;
  });
  const hot = `<line class="xh" id="${id}-xh" y1="${T}" y2="${H-B}"/><circle class="hot" id="${id}-hot" style="--c:${series[0].c}" r="5"/>`;
  const svg = `<svg class="trend" id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||"trend")}" data-n="${n}">${g}${body}${hot}` +
    `<rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" data-trend="${id}"/></svg>`;
  TRENDS[id] = {labels, series, x, y, fmt, W, L, R};
  const legend = series.length>1 ? `<div class="legend">${series.map((s,i)=>i===0?`<span><b style="--c:${s.c}"></b>${esc(s.name)}</span>`:`<span><i style="opacity:.5"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return svg + legend;
}
const TRENDS = {};
document.addEventListener("mousemove", e=>{
  const r = e.target.closest && e.target.closest("[data-trend]"); if(!r) return;
  const id = r.getAttribute("data-trend"), T = TRENDS[id]; if(!T) return;
  const svg = document.getElementById(id), box = svg.getBoundingClientRect(), sx = T.W/box.width;
  const px = (e.clientX-box.left)*sx, n = T.labels.length;
  let i = n===1 ? 0 : Math.round((px-T.L)/((T.W-T.L-T.R)/(n-1))); i = Math.max(0, Math.min(n-1, i));
  const xh = document.getElementById(id+"-xh"), hot = document.getElementById(id+"-hot");
  const v0 = T.series[0].vals[i];
  xh.setAttribute("x1", T.x(i)); xh.setAttribute("x2", T.x(i)); xh.style.opacity = .5;
  if(v0!=null){ hot.setAttribute("cx", T.x(i)); hot.setAttribute("cy", T.y(v0)); hot.style.opacity = 1; } else hot.style.opacity = 0;

});

function trendCard(p, title, sub, html, tableRows){
  const mode = rankMode["t"+p.k] || "chart";
  const body = mode === "table"
    ? `<div class="tbl" style="padding:0"><table><thead><tr><th class="l">Month</th>${tableRows.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>` +
      tableRows.rows.map(r=>`<tr><td class="l">${esc(r[0])}</td>${r.slice(1).map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>`

// Monthly series summed over the clients shown, keyed by each series' own month label. Order follows the
// longest series (all of a program's clients share the same trailing months).
function sumSeries(list){   // list: [[ [label, value], ... ] per client]
  const order = []; const tot = new Map();
  list.slice().sort((a,b)=>b.length-a.length).forEach(rows=>rows.forEach(([lb,v])=>{
    if(!tot.has(lb)){ tot.set(lb, 0); order.push(lb); } tot.set(lb, tot.get(lb) + (v||0)); }));
  return {labels:order, vals:order.map(l=>tot.get(l))};
}

// ---------- Live Review commands (Aaron, 2026-11-03)
// Live Review is a local page (127.0.0.1, a fresh port and token each run), so it has no link to
// share. What this page can hand over is the command that starts it, for one client or for every
// client in the list, with the period of that client's newest deck.
function lrOk(c){ return /^\d{3,6}$/.test(String(c.id)) && /^\d{4}\.\d{2}$/.test(String(c.deck_period || DATA.period)); }
function lrPeriodOf(c){ return String(c.deck_period || DATA.period); }
function lrRepo(){ return String(((DATA.live_review||{}).repo) || "").replace(/'/g, "''"); }
function lrOne(c){
  return `Set-Location '${lrRepo()}'; & .\\.venv\\Scripts\\python.exe scripts\\live_review.py ${c.id} --period ${lrPeriodOf(c)}`;
}
function lrAll(rows){
  const list = rows.filter(lrOk);
  const lines = list.map(c => `  [pscustomobject]@{Id='${c.id}'; Period='${lrPeriodOf(c)}'; Name='${String(c.name||"").replace(/[\r\n]/g, " ").replace(/'/g, "''")}'}`);
  return [
    `# Live Review: one page per client, each in its own window. Close a window to stop that page.`,
    `$repo = '${lrRepo()}'`,
    `if (-not (Test-Path (Join-Path $repo 'scripts\\live_review.py'))) {`,
    `  Write-Warning "Live Review is not in $repo. Switch that checkout to main, or change $repo."; return`,
    `}`,
    `$py = Join-Path $repo '.venv\\Scripts\\python.exe'`,
    `$clients = @(`,
    lines.join("\n"),
    `)`,
    `foreach ($c in $clients) {`,
    `  Write-Host "Opening Live Review for $($c.Id) $($c.Name) ($($c.Period))"`,
    `  Start-Process -FilePath $py -WorkingDirectory $repo -ArgumentList @('scripts\\live_review.py', $c.Id, '--period', $c.Period)`,
    `  Start-Sleep -Seconds 2`,
    `}`,
  ].join("\n");
}
function lrBox(title, text){
  let d = document.getElementById("lrbox");
  if (!d){
    d = document.createElement("dialog"); d.id = "lrbox";
    d.innerHTML = `<h3></h3><p>Copying was blocked here, so select this and copy it, then paste it into PowerShell.</p><textarea id="lrtext" readonly spellcheck="false" aria-label="PowerShell script"></textarea><div class="row"><button type="button" class="tagbtn" id="lrsel">Select all</button><button type="button" class="tagbtn" id="lrclose">Close</button></div>`;
    document.body.appendChild(d);
    d.querySelector("#lrclose").onclick = () => d.close();
    d.querySelector("#lrsel").onclick = () => { const t = d.querySelector("#lrtext"); t.focus(); t.select(); };
  }
  d.querySelector("h3").textContent = title;
  const ta = d.querySelector("#lrtext"); ta.value = text;
  if (d.showModal) d.showModal(); else d.setAttribute("open", "");
  ta.focus(); ta.select();
}
async function lrCopy(text, title, done){
  try { await navigator.clipboard.writeText(text); note(done); }
  catch(e){ lrBox(title, text); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lr],[data-lr-all]");
  if (!b) return;
  if (b.hasAttribute("data-lr-all")){
    const rows = (window.__lrRows || []).filter(lrOk);
    if (!rows.length){ note("No client in this list has a period to open."); return; }
    lrCopy(lrAll(rows), `Live Review script for ${rows.length} client${rows.length===1?"":"s"}`,
           `Copied a PowerShell script for ${rows.length} client${rows.length===1?"":"s"}. Paste it into PowerShell.`);
    return;
  }
  const c = (window.__lrRows || []).find(x => String(x.id) === b.dataset.lr);
  if (!c || !lrOk(c)){ note("That client has no period to open."); return; }
  lrCopy(lrOne(c), `Live Review for ${c.name}`, `Copied the Live Review command for ${c.name}. Paste it into PowerShell.`);
});

// ---------- build readiness (roster)
// Which product an input belongs to, so its chip carries that product's colour.
function inColour(program){
  const k = String(program||"").toUpperCase().replace(/-.*$/,"");
  return (PK[k]||{}).c || "var(--muted)";
}
// Build readiness sort: one column at a time, ascending -> descending -> off.
// Off is client id order, the order the data arrives in, so the table can always
// be put back the way it was. Per viewer, so it lives in localStorage, and a stored
// value this page does not recognise is ignored rather than trusted.
const RSORT_KEYS = ["client","products","ready","inputs","deck","sent"];
let rSort = {k:null, dir:1};
try {
  const s = JSON.parse(localStorage.getItem("rpe-dash-rsort")||"null");
  if (s && RSORT_KEYS.includes(s.k) && (s.dir===1 || s.dir===-1)) rSort = {k:s.k, dir:s.dir};
} catch(e){}
function persistSort(){ try{ localStorage.setItem("rpe-dash-rsort", JSON.stringify(rSort)); }catch(e){} }
// Each column sorts on what it MEANS, not on its markup: Ready puts ready before
// blocked, Inputs counts what is missing, Deck puts this period's build first, Sent
// puts what still needs sending first. A row the column does not apply to - no
// readiness check, no deck to send - returns null and stays at the bottom in BOTH
// directions, so flipping a sort never floods the top of the table with blanks.
function rosterKey(c, k){
  const v = rv(c), r = v.readiness;
  switch (k){
    case "client":   return [String(c.name||"").toLowerCase()];
    case "products": return [...PROGS.map(p=>c.programs.includes(p.k)?0:1), -c.programs.length];
    case "ready":    return r ? [r.ready?0:1, r.blocked_on.length] : null;
    case "inputs": {
      if (!r) return null;
      const n = st => r.inputs.filter(i=>String(i.state||"").toLowerCase()===st).length;
      return [n("missing"), n("stale"), r.inputs.length - n("present") - n("missing") - n("stale")];
    }
    // No deck at all is NOT "not applicable" here - it is the state this column exists
    // to show - so it is the last rank rather than null, and descending puts it first.
    case "deck":     return v.built ? [0, ""] : (c.decks.length ? [1, String(c.deck_period||"")] : [2, ""]);
    case "sent": {
      const s = sentState(c);
      if (s) return [1, String(s.date)];
      return v.built ? [0, ""] : null;
    }
  }
  return [0];
}
function cmpKeys(a, b){
  for (let i=0; i<Math.max(a.length, b.length); i++){
    const x=a[i], y=b[i];
    if (x===y) continue;
    if (x===undefined) return -1;
    if (y===undefined) return 1;
    return (typeof x==="number" && typeof y==="number") ? x-y : String(x).localeCompare(String(y));
  }
  return 0;
}
function sortRoster(rows){
  if (!rSort.k) return rows;
  const byId = (a,b)=>String(a.id).localeCompare(String(b.id), undefined, {numeric:true});
  return rows.map(c=>({c, key:rosterKey(c, rSort.k)})).sort((a,b)=>{
    if (!a.key !== !b.key) return a.key ? -1 : 1;             // not applicable: always last
    const d = a.key ? cmpKeys(a.key, b.key) * rSort.dir : 0;
    // Ties fall back to the client's name, then id, in a fixed direction, so rows that
    // compare equal do not reshuffle every time the column is flipped.
    return d || String(a.c.name).localeCompare(String(b.c.name)) || byId(a.c, b.c);
  }).map(x=>x.c);
}
function sortTh(k, label){
  const on = rSort.k===k;
  const aria = on ? (rSort.dir===1 ? "ascending" : "descending") : "none";
  const arr = on ? (rSort.dir===1 ? "\u25b2" : "\u25bc") : "\u2195";
  const hint = !on ? "Click to sort"
    : (rSort.dir===1 ? "Sorted ascending \u2014 click for descending" : "Sorted descending \u2014 click to clear the sort");
  return `<th class="l sortable" aria-sort="${aria}"><button type="button" data-rsort="${k}" title="${hint}">` +
    `${label}<span class="arr" aria-hidden="true">${arr}</span></button></th>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-rsort]");
  if (!b) return;
  const k = b.dataset.rsort;
  if (!RSORT_KEYS.includes(k)) return;
  if (rSort.k !== k) rSort = {k, dir:1};
  else if (rSort.dir === 1) rSort = {k, dir:-1};
  else rSort = {k:null, dir:1};
  persistSort(); update();
  // The table is re-rendered, so the button that was clicked no longer exists; put
  // keyboard focus back on its replacement or a keyboard user is dropped to the top.
  const again = document.querySelector(`[data-rsort="${k}"]`);
  if (again) again.focus();
});

function chipFor(i){
  const st = String(i.state||"").toLowerCase();
  const cls = st==="missing" ? " miss" : (st==="stale" ? " stale" : "");
  const mark = st==="present" ? "" : (st==="missing" ? " \u2717" : (st==="stale" ? " stale" : " ?"));
  return `<span class="in${cls}" style="--c:${inColour(i.program)}" title="${esc((i.program||"")+" \u00b7 "+(i.detail||i.state||""))}">` +
    `<i></i>${esc(i.input||"")}${mark}</span>`;
}
// Build readiness for THIS period. The view lists what can be built and what is missing; deck_status
// owns the answer, so this page and the delivery dashboard cannot disagree.
function viewRoster(vis){
  const P = rPeriod;
  const views = vis.map(c => [c, rv(c)]);
  const withR = views.filter(([,v])=>v.readiness);
  const ready = withR.filter(([,v])=>v.readiness.ready).length;
  const built = views.filter(([,v])=>v.built).length;
  const sentN = views.filter(([c])=>sentState(c)).length;
  const picker = `<label class="rp" title="Which period this view reports: its inputs, the decks built for it and the sends recorded against it. Shared with every viewer of this page.">Period ` +
    `<select class="sel" id="rperiod" aria-label="Build readiness period">` +
    RPERIODS.map(p => `<option value="${esc(p)}"${p===P?" selected":""}>${esc(p)}${p===DATA.period?" (cycle)":""}</option>`).join("") +
    `</select></label>`;
  const tiles = `<div class="kpis">${kpi("Ready to build", `${ready} of ${withR.length}`, `inputs landed for ${esc(P)}`, null)}${kpi("Built", N(built), `a deck exists for ${esc(P)}`, null)}${kpi("Sent", N(sentN), "recorded against " + esc(P), null)}</div>`;
  const sorted = sortRoster(vis);
  window.__lrRows = sorted;
  const rows = sorted.map(c=>{
      const v = rv(c), r = v.readiness;
      const dots = `<span class="dots">${PROGS.map(p=>`<i class="${c.programs.includes(p.k)?'':'off'}" style="--c:${p.c}" title="${p.short}"></i>`).join("")}</span>` +
        ` <span class="dim" style="margin-left:6px">${c.programs.map(k=>PK[k].short).join(" \u00b7 ")}</span>`;
      // Programs for a client clients.md does not list are inferred from this month's files.
      const progNote = (c.programs.length ? "" : `<span class="dim">no program data this month</span>`) +
        (c.programs_from === "data" ? ` <span class="chip soft" title="Not in clients.md: programs inferred from this month's files on the reports share">from data</span>` : "");
      let state, ins;
      if (!r){
        state = `<span class="st">${ico("unk","unk")}not checked</span>`;
        ins = `<span class="dim">\u2014</span>`;
      } else if (r.ready){
        state = `<span class="st">${ico("ok","ok")}ready</span>`;
        ins = `<div class="ins">${r.inputs.map(i=>chipFor(i)).join("")}</div>`;
      } else {
        state = `<span class="st">${ico("no","bad")}blocked</span>` +
          (r.blocked_on.length?`<span class="need">${r.blocked_on.map(esc).join(", ")}</span>`:"");
        ins = `<div class="ins">${r.inputs.map(i=>chipFor(i)).join("")}</div>`;
      }
      const deck = v.built
        ? `<span class="chip good" title="${esc(v.decks.join(", "))}">built ${esc(P)}</span>`
        : (c.decks.length?`<span class="chip">newest ${esc(c.deck_period||"")}</span>`
                         :`<span class="chip warn">none</span>`);
      return `<tr>
      <td class="l"><span class="cl">${esc(c.name)}</span><span class="id">${c.id}</span></td>
      <td class="l">${dots}${progNote}</td>
      <td class="l">${state}</td>
      <td class="l" style="white-space:normal;max-width:430px">${ins}</td>
      <td class="l">${deck}</td>
      <td class="l">${sentCell(c)}</td>
      <td class="l">${lrOk(c) ? `<button type="button" class="tagbtn" data-lr="${esc(c.id)}" title="Copy the PowerShell command that opens Live Review for ${esc(c.name)} (${esc(lrPeriodOf(c))})">Copy command</button>` : `<span class="dim">\u2014</span>`}</td></tr>`;
    }).join("");
  const t = `<div class="tbl rdy"><table><thead><tr>` +
    sortTh("client", "Client") + sortTh("products", "Products") + sortTh("ready", "Ready to build") +
    sortTh("inputs", `Inputs for ${esc(P)}`) + sortTh("deck", "Deck") + sortTh("sent", "Sent") + `<th class="l">Live Review</th>` +
    `</tr></thead><tbody>${rows}</tbody></table></div>`;
  return head(`Build readiness \u00b7 ${P}`, "What can be built, what is missing, and what has gone out.", picker) + tiles +
    `<section class="card"><header><h2>Your clients</h2><span style="display:inline-flex;gap:10px;align-items:center"><span class="chip">${vis.length}</span><button type="button" class="tagbtn" data-lr-all title="Copy one PowerShell script that opens Live Review for every client listed here, each in its own window">Copy Live Review script</button></span></header>${t}</section>`;
}

// ---------- sortable section tables (Aaron, 2026-09-14: "sort the product columns too, such as by loss rate")
// Every column that carries a value sorts, one column per section, remembered per viewer. A
// numeric column sorts highest first on the first click (so "by loss rate" is one click), a text
// column A to Z; the next click reverses it and the third clears it. The value is read from what
// the cell SHOWS ($1.6M, -$1.2M, 6.85%, 5.75 : 1, Aug 2026), never from its sub-label. A row that
// spans the table (no figures for that client) and the peer row stay at the bottom both ways.
const SSORT_KEY = "rpe-dash-ssort";
let sSort = {};
try { const s = JSON.parse(localStorage.getItem(SSORT_KEY)||"null"); if (s && typeof s === "object" && !Array.isArray(s)) sSort = s; } catch(e){}
function persistSSort(){ try{ localStorage.setItem(SSORT_KEY, JSON.stringify(sSort)); }catch(e){} }
const MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function cellKey(td){
  if (!td || td.colSpan > 1 || td.querySelector("svg")) return null;
  const cl = td.querySelector(".cl");
  if (cl) return cl.textContent.trim().toLowerCase();
  let txt = "";
  td.childNodes.forEach(n => {
    if (n.nodeType === 3 || !(n.classList && (n.classList.contains("sub") || n.classList.contains("id")))) txt += n.textContent;
  });
  txt = txt.replace(/\u2212/g, "-").trim();
  if (!txt || txt === "\u2014") return null;
  const my = txt.match(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+[\u2019']?(\d{2,4})\b/);
  if (my) return (my[2].length === 2 ? 2000 + Number(my[2]) : Number(my[2])) * 100 + MON3.indexOf(my[1]);
  const m = txt.match(/-?\$?\d[\d,]*(\.\d+)?\s*([KkMm](?![a-z])|%)?/);
  if (!m) return txt.toLowerCase();
  let v = parseFloat(m[0].replace(/[$,\s%KkMm]/g, ""));
  const u = (m[2] || "").toUpperCase();
  if (u === "K") v *= 1e3; else if (u === "M") v *= 1e6;
  return isNaN(v) ? txt.toLowerCase() : v;
}
function cmpCell(a, b){
  if (typeof a === "number" && typeof b === "number") return a - b;
  if (typeof a === "number") return -1;
  if (typeof b === "number") return 1;
  return String(a).localeCompare(String(b));
}
function applySectionSorts(){
  document.querySelectorAll("#view section.sect[data-sec]").forEach(sec => {
    const key = sec.dataset.sec, table = sec.querySelector(".tbl table");
    if (!table || !table.tHead || !table.tBodies.length) return;
    const ths = [...table.tHead.rows[0].cells], body = table.tBodies[0], rows = [...body.rows];
    const sample = rows.find(r => r.cells.length === ths.length && !r.classList.contains("peer"));
    const st = sSort[key];
    let idx = -1;
    ths.forEach((th, i) => {
      const label = th.textContent.replace(/\s+/g, " ").trim();
      if (!label || (sample && sample.cells[i] && sample.cells[i].querySelector("svg"))) return;
      const on = !!(st && st.col === label);
      if (on) idx = i;
      th.classList.add("sortable");
      th.setAttribute("aria-sort", on ? (st.dir === 1 ? "ascending" : "descending") : "none");
      const hint = on ? "Sorted " + (st.dir === 1 ? "ascending" : "descending") + " \u2014 click to change" : "Click to sort";
      th.innerHTML = `<button type="button" data-ssort="${esc(key)}" data-col="${esc(label)}" data-num="${th.classList.contains("l") ? 0 : 1}" title="${hint}">` +
        `${th.innerHTML}<span class="arr" aria-hidden="true">${on ? (st.dir === 1 ? "\u25b2" : "\u25bc") : "\u2195"}</span></button>`;
    });
    if (idx < 0) return;
    const keyed = rows.filter(r => !r.classList.contains("peer"))
      .map((r, n) => ({r, n, k: r.cells.length === ths.length ? cellKey(r.cells[idx]) : null}));
    keyed.sort((a, b) => {
      if ((a.k === null) !== (b.k === null)) return a.k === null ? 1 : -1;
      return (a.k === null ? 0 : cmpCell(a.k, b.k) * st.dir) || a.n - b.n;
    });
    keyed.forEach(x => body.appendChild(x.r));
    rows.filter(r => r.classList.contains("peer")).forEach(r => body.appendChild(r));
  });
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-ssort]");
  if (!b) return;
  const key = b.dataset.ssort, col = b.dataset.col, first = b.dataset.num === "1" ? -1 : 1, st = sSort[key];
  if (!st || st.col !== col) sSort[key] = {col, dir: first};
  else if (st.dir === first) sSort[key] = {col, dir: -first};
  else delete sSort[key];
  persistSSort(); update();
  const again = [...document.querySelectorAll("[data-ssort]")].find(x => x.dataset.ssort === key && x.dataset.col === col);
  if (again) again.focus();
});

// ---------- chrome: nav, bottom bar, theme, rail
const NAV = [
  {k:"overview", label:"Overview", icon:"grid"},
  {k:"ars", label:"ARS", dot:"var(--c-ars)"}, {k:"ics", label:"ICS", dot:"var(--c-ics)"},
  {k:"mrpc", label:"MRPC", dot:"var(--c-mrpc)"}, {k:"cp", label:"CashPlease", dot:"var(--c-cp)"},
  {k:"roster", label:"Build readiness", icon:"list"}, {k:"actions", label:"Needs a CSM", icon:"alert"},
];
function navCount(k, vis){
  if (PK[k.toUpperCase()]) return vis.filter(hasProg(k.toUpperCase())).length || "";
  if (k==="actions") return vis.filter(c=>c.actions && c.actions.count).length || "";
  if (k==="roster"){ const n = vis.filter(c=>{ const r=rv(c).readiness; return r && !r.ready; }).length; return n || ""; }
  return "";
}
function renderNav(vis){
  const items = NAV.map(n=>{
    const cnt = navCount(n.k, vis), hot = (n.k==="actions"||n.k==="roster") && cnt;
    const lead = n.icon ? `<svg viewBox="0 0 24 24" aria-hidden="true">${IC[n.icon]}</svg>` : `<span class="dot" style="--c:${n.dot}"></span>`;
    return `<a class="nl" href="#${n.k}" ${view===n.k?'aria-current="page"':""} title="${esc(n.label)}">${lead}<span class="lbl">${esc(n.label)}</span><span class="badge${hot?" hot":""}">${cnt}</span></a>`;
  });
  items.splice(1, 0, `<div class="sec">Programs</div>`);
  items.splice(6, 0, `<div class="sec">Work</div>`);
  items.push(`<div class="sec">Reference</div><a class="nl" href="workflow.html" title="How the decks are made"><svg viewBox="0 0 24 24" aria-hidden="true">${IC.book}</svg><span class="lbl">How decks are made</span></a>`);
  document.getElementById("nav").innerHTML = items.join("");
  const bt = [["overview","Overview","grid"],["ars","ARS",null,"var(--c-ars)"],["ics","ICS",null,"var(--c-ics)"],["mrpc","MRPC",null,"var(--c-mrpc)"],["cp","CashPlease",null,"var(--c-cp)"]];
  document.getElementById("bottom").innerHTML = bt.map(([k,l,i,c])=>
    `<button type="button" data-go="${k}" ${view===k?'aria-current="page"':""}>${i?`<svg viewBox="0 0 24 24" aria-hidden="true">${IC[i]}</svg>`:`<span class="dot" style="--c:${c}"></span>`}${l}</button>`).join("") +
    `<button type="button" id="morebtn" ${["roster","actions"].includes(view)?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${IC.more}</svg>More</button>`;
  document.getElementById("sheetm").innerHTML =
    `<a href="#roster">${ico("list")}Build readiness</a><a href="#actions">${ico("alert")}Needs a CSM</a><a href="workflow.html">${ico("book")}How the decks are made</a>` +
    `<button type="button" id="theme2">${ico("moon")}Night or day</button>`;
}
document.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]"); if (g){ location.hash = g.dataset.go; document.getElementById("sheetm").classList.remove("on"); return; }
  if (e.target.closest("#morebtn")){ document.getElementById("sheetm").classList.toggle("on"); return; }
  if (e.target.closest("#theme") || e.target.closest("#theme2")){ toggleTheme(); return; }
  if (e.target.closest("#fold")){ setRail(!document.getElementById("app").classList.contains("rail")); return; }
  if (e.target.closest("#needsmore")){ needsAll = !needsAll; update(); return; }
  const r = e.target.closest("[data-rank]"); if (r){ const [k,m] = r.dataset.rank.split(":"); rankMode[k] = m; update(); return; }
  if (!e.target.closest("#sheetm")) document.getElementById("sheetm").classList.remove("on");
});
function setRail(on){
  document.getElementById("app").classList.toggle("rail", on);
  try { localStorage.setItem("rpe-dash-rail", on ? "1" : "0"); } catch(e){}
}
function applyTheme(t){
  if (t==="light"||t==="dark") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  const dark = document.documentElement.getAttribute("data-theme")==="dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  document.getElementById("themelbl").textContent = dark ? "Day" : "Night";
  paintMark(dark);
}
function toggleTheme(){
  const dark = document.documentElement.getAttribute("data-theme")==="dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const next = dark ? "light" : "dark";
  try { localStorage.setItem("rpe-dash-theme", next); } catch(e){}
  applyTheme(next);
}
// The corner mark: two stacked slides, navy in front of teal (light); pale in front of light blue (dark).
function paintMark(dark){
  document.getElementById("mk-front").setAttribute("fill", dark ? "#EEF3FA" : "#1C2541");
  document.getElementById("mk-back").setAttribute("fill", dark ? "#5FB3C9" : "#15627E");
}
document.getElementById("q").addEventListener("input", e=>{ Q = e.target.value.trim().toLowerCase(); update(); });
document.addEventListener("keydown", e=>{
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||""));
  if (e.key === "/" && !typing){ e.preventDefault(); document.getElementById("q").focus(); }
  else if (e.key === "Escape" && typing && e.target.id==="q"){ e.target.value=""; Q=""; e.target.blur(); update(); }
});
window.addEventListener("hashchange", ()=>{ fromHash(); update(); window.scrollTo({top:0}); });

// ---------- update
// One view must never take the page down with it. A section that cannot render says so and the rest
// of the page stands.
function safe(label, fn){
  try { return fn(); }
  catch (e){
    console.error(label + " failed to render", e);
    return `<section class="card"><header><h2>${esc(label)}</h2></header><div class="empty">This view could not be rendered from the data in this build.</div></section>`;
  }
}
function update(){
  const vis = visible();
  renderNav(vis);
  const fn = {overview:viewOverview, ars:viewARS, ics:viewICS, mrpc:viewMRPC, cp:viewCP, roster:viewRoster, actions:viewActions}[view];
  const html = safe(view, ()=>fn(vis));
  document.getElementById("view").innerHTML = vis.length ? html : `<div class="empty">No client matches \u201c${esc(Q)}\u201d.</div>`;
  applySectionSorts();
}
document.getElementById("who").textContent = SCOPE.csm ? `${SCOPE.csm}'s clients` : "Your clients";
document.getElementById("updated").innerHTML = `<i></i>Updated ${esc(DATA.generated)}`;
try { setRail(localStorage.getItem("rpe-dash-rail") === "1"); } catch(e){}
let savedTheme = null; try { savedTheme = localStorage.getItem("rpe-dash-theme"); } catch(e){}
applyTheme(savedTheme);
fromHash();
update();
</script>
