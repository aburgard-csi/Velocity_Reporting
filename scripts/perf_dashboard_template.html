<title>RPE Client Performance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --navy:#00274C; --orange:#F47A29; --teal:#0D9488; --gold:#E7A93B;
  --ars:#00274C; --ics:#F47A29; --mrpc:#0D9488; --cp:#C9911F;
  --bg:#F7F9FB; --surface:#FFFFFF; --tile:#ECF0F4; --rowalt:#EEF2F7;
  --grid:#E4EAF1; --hair:#D9DEE5; --muted:#B8C0CA;
  --ink:#0E1B2A; --ink2:#5A6670; --ink3:#8A96A3;
  --head:#00274C; --accent:#F47A29; --accent-ink:#FFFFFF;
  --good:#1E7F4F; --warn:#B7791F; --bad:#B42318;
  --track:#E4EAF1; --shadow:0 1px 2px rgba(0,39,76,.08), 0 6px 18px rgba(0,39,76,.06);
  --chip-bg:#FFFFFF; --chip-on:#245C8C; --chip-on-ink:#FFFFFF; --focus:#F47A29;
  --chip-all:#FFFFFF; --chip-all-ink:#0E1B2A; --chip-all-line:#C5CDD6;
  --chip-off:#E9EDF1; --chip-off-ink:#5A6670;
  --ov:#5A7590;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ars:#8FB0D0; --ics:#F79552; --mrpc:#2FB8A9; --cp:#E7B84C;
    --bg:#0B1620; --surface:#12212E; --tile:#182B3B; --rowalt:#15263400;
    --grid:#233647; --hair:#2A3F52; --muted:#4A5E70;
    --ink:#E8EEF4; --ink2:#A9B7C4; --ink3:#7C8B99;
    --head:#E8EEF4; --accent:#F79552; --accent-ink:#0B1620;
    --good:#4CC38A; --warn:#E2B14A; --bad:#F27E75;
    --track:#233647; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --chip-bg:#12212E; --chip-on:#6E93B4; --chip-on-ink:#0B1620; --focus:#F79552;
    --chip-all:#1E3244; --chip-all-ink:#E8EEF4; --chip-all-line:#3A5168;
    --chip-off:#0E1A24; --chip-off-ink:#8C9BA8;
    --ov:#9DB4C8;
  }
}
:root[data-theme="dark"]{
  --ars:#8FB0D0; --ics:#F79552; --mrpc:#2FB8A9; --cp:#E7B84C;
  --bg:#0B1620; --surface:#12212E; --tile:#182B3B; --rowalt:#15263400;
  --grid:#233647; --hair:#2A3F52; --muted:#4A5E70;
  --ink:#E8EEF4; --ink2:#A9B7C4; --ink3:#7C8B99;
  --head:#E8EEF4; --accent:#F79552; --accent-ink:#0B1620;
  --good:#4CC38A; --warn:#E2B14A; --bad:#F27E75;
  --track:#233647; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --chip-bg:#12212E; --chip-on:#6E93B4; --chip-on-ink:#0B1620; --focus:#F79552;
    --chip-all:#1E3244; --chip-all-ink:#E8EEF4; --chip-all-line:#3A5168;
    --chip-off:#0E1A24; --chip-off-ink:#8C9BA8;
    --ov:#9DB4C8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Carlito,Calibri,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.4}
h1,h2,h3,.mont{font-family:Montserrat,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:1380px;margin:0 auto;padding:22px 26px 60px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:18px}
header.top h1{margin:0;font-size:24px;font-weight:700;color:var(--head);letter-spacing:-.01em;text-wrap:balance}
header.top .sub{color:var(--ink2);margin-top:4px;font-size:14px}
header.top .updated{margin-top:6px;font-family:Montserrat,sans-serif;font-size:11.5px;font-weight:600;
  letter-spacing:.03em;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;
  background:var(--tile);border:1px solid var(--hair);border-radius:999px;padding:4px 11px}
header.top .updated i{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.pill{display:inline-block;background:var(--accent);color:var(--accent-ink);font-family:Montserrat,sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;padding:6px 14px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.eyebrow{font-family:Montserrat,sans-serif;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}

/* filters */
.filters{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:14px 16px;display:grid;gap:12px;margin-bottom:18px}
.frow{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.frow .eyebrow{width:74px;padding-top:7px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{appearance:none;border:1px solid var(--hair);background:var(--chip-off);color:var(--chip-off-ink);font:inherit;font-size:13.5px;padding:5px 11px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s}
.chip:hover{border-color:var(--muted)}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chip .sw{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip.on .sw{outline:2px solid var(--chip-on-ink);outline-offset:-1px}
/* three states (Aaron, 2026-09-14): white = the whole row is selected, blue = on, light gray = off */
.chip.in{background:var(--chip-all);color:var(--chip-all-ink);border-color:var(--chip-all-line)}
.chip.all{font-weight:700}
.chipset{display:contents}
.chip.fold{background:none;border-style:dashed;color:var(--ink2)}
.chip.fold:hover{color:var(--ink)}
.fkey{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink2);padding-left:86px}
.fkey i{display:inline-block;width:18px;height:11px;border-radius:999px;border:1px solid;vertical-align:-1px;margin-right:6px}
@media (max-width:600px){.fkey{padding-left:0}}
.chip .tags{display:inline-flex;gap:3px}
.chip .tags i{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--c)}
.chip .ct{font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.chip.off{opacity:.45}
.chip.off:hover{opacity:.8}
.fr-actions{display:flex;gap:10px;align-items:center;margin-left:auto}
.link{background:none;border:none;color:var(--ink2);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 2px}
.link:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
header.top .doclink{display:inline-block;margin-top:8px;font-family:Montserrat,sans-serif;font-size:12.5px;font-weight:600;color:var(--head);text-underline-offset:3px}
header.top .doclink:hover{color:var(--accent)}
header.top .doclink:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:26px}
.stat{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:12px 14px 11px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--muted))}
.stat .v{font-family:Montserrat,sans-serif;font-weight:700;font-size:22px;color:var(--head);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.stat .l{font-size:13px;color:var(--ink2);margin-top:3px}
.stat .e{font-family:Montserrat,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--ink3))}

/* sections */
section.prog{background:var(--surface);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);margin-bottom:26px;overflow:hidden}
section.prog>.hd{display:flex;align-items:baseline;gap:14px;padding:16px 20px 10px;border-bottom:1px solid var(--grid);flex-wrap:wrap}
section.prog>.hd h2{margin:0;font-size:18px;font-weight:700;color:var(--head);display:flex;align-items:center;gap:10px}
section.prog>.hd h2 .sw{width:12px;height:12px;border-radius:3px;background:var(--c)}
section.prog>.hd .src{color:var(--ink3);font-size:13px;margin-left:auto}
section.prog>.hd .n{color:var(--ink2);font-size:13.5px}
.body{display:grid;grid-template-columns:minmax(300px,4fr) minmax(0,9fr);gap:0}
@media (max-width:980px){.body{grid-template-columns:1fr}}
.rank{padding:16px 20px;border-right:1px solid var(--grid)}
@media (max-width:980px){.rank{border-right:none;border-bottom:1px solid var(--grid)}}
.rank h3{margin:0 0 2px;font-size:13.5px;font-weight:600;color:var(--ink)}
.rank .cap{color:var(--ink2);font-size:13px;margin-bottom:12px}
.bars{display:grid;grid-template-columns:minmax(92px,auto) 1fr auto;column-gap:10px;row-gap:7px;align-items:center;font-variant-numeric:tabular-nums}
.bars .nm{font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.bars .tr{height:9px;background:var(--track);border-radius:4px;position:relative}
.bars .bar{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:0 4px 4px 0;min-width:2px}
.bars .bar.neg{background:var(--bad)}
.bars .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink2);opacity:.8}
.bars .vl{font-size:13px;color:var(--ink2);white-space:nowrap}
.bars .hit{grid-column:1/-1;display:contents}
.bars .hit:hover .tr{filter:brightness(.92)}
.bars .hit:hover .nm{color:var(--head);font-weight:700}
.legend{display:flex;gap:14px;align-items:center;margin-top:12px;color:var(--ink2);font-size:12.5px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;background:var(--ink2);vertical-align:middle;margin-right:5px}
.legend b{display:inline-block;width:12px;height:9px;border-radius:2px;background:var(--c);vertical-align:middle;margin-right:5px}

.tbl{overflow-x:auto;padding:6px 8px 12px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-family:Montserrat,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:right;padding:10px 10px 8px;border-bottom:1px solid var(--hair);white-space:nowrap;vertical-align:bottom}
th.l,td.l{text-align:left}
td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap;color:var(--ink);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--tile)}
td .cl{font-weight:700;color:var(--head)}
td .id{color:var(--ink3);font-size:12px;margin-left:5px}
td .sub{display:block;color:var(--ink2);font-size:12px;margin-top:1px}
td.dim,td .dim{color:var(--ink3)}
td .neg{color:var(--bad)}
.tag{display:inline-block;font-family:Montserrat,sans-serif;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--tile);color:var(--ink2);border:1px solid var(--hair)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.av{display:block;font-size:12px;line-height:1.5;white-space:nowrap}
.av code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:var(--tile);border:1px solid var(--hair);padding:0 4px;border-radius:3px;color:var(--ink)}
ul.acts{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
ul.acts li{display:grid;grid-template-columns:3.2em 1fr;align-items:baseline;column-gap:8px}
ul.acts b{font-family:Montserrat,sans-serif;font-size:20px;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
ul.acts b.zero{color:var(--ink3)}
ul.acts .sub{grid-column:2;display:block;color:var(--ink2);font-size:12px}
/* mark-sent control - the one place the page writes anything */
button.tag{cursor:pointer;font-family:Montserrat,sans-serif;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;background:var(--surface);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);transition:background .12s,color .12s,border-color .12s}
button.tag:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.tag:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button.tag[disabled]{cursor:default;background:var(--tile);color:var(--ink3);border-color:var(--hair)}
/* a recorded send is a button too: one click arms "Undo send?", a second confirms */
button.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
button.tag.good:hover{background:var(--good);color:var(--accent-ink);border-color:var(--good)}
button.tag.confirm,button.tag.confirm:hover{background:var(--bad);color:var(--accent-ink);border-color:var(--bad)}
#note{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--head);color:var(--bg);font-size:13px;line-height:1.4;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.28);max-width:min(520px,88vw);opacity:0;pointer-events:none;transition:opacity .15s}
#note.on{opacity:1}
.spark{display:block;width:120px;height:32px}
.spark path.ln{fill:none;stroke:var(--c);stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round}
.spark path.ar{fill:var(--c);opacity:.12}
.spark path.gl{fill:none;stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 3}
.spark circle{fill:var(--c)}
.spark circle.pt{fill:var(--surface);stroke:var(--c);stroke-width:1.5}
.spark rect.hit{fill:transparent}
.peer td{background:var(--rowalt);color:var(--ink2);font-style:italic}
.peer td .cl{color:var(--ink2);font-weight:600;font-style:normal}
.empty{padding:26px 20px;color:var(--ink2)}

/* readiness */
.rdy td .st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.rdy td .st i{width:9px;height:9px;border-radius:50%;flex:none}
.rdy .ok i{background:var(--good)} .rdy .no i{background:var(--bad)} .rdy .unk i{background:var(--muted)}
.rdy td .need{display:block;color:var(--ink2);font-size:12px;margin-top:2px;white-space:normal}
.rdy td .ins{display:flex;flex-wrap:wrap;gap:4px}
.rdy td .in{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;
  border-radius:999px;border:1px solid var(--hair);background:var(--chip-bg);color:var(--ink2);white-space:nowrap}
.rdy td .in i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c,var(--muted))}
.rdy td .in.miss{border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.rdy td .in.stale{border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn)}
/* sortable readiness headers - the button carries the th's padding so the header
   looks exactly as it did, and the whole cell is the click and keyboard target */
.rdy th.sortable{padding:0}
.rdy th.sortable button{appearance:none;background:none;border:0;margin:0;width:100%;font:inherit;
  letter-spacing:inherit;text-transform:inherit;color:inherit;text-align:left;cursor:pointer;
  padding:10px 10px 8px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.rdy th.sortable button:hover{color:var(--ink)}
.rdy th.sortable button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:4px}
.rdy th.sortable .arr{font-size:10px;letter-spacing:0;opacity:.4}
.rdy th.sortable[aria-sort="ascending"] button,.rdy th.sortable[aria-sort="descending"] button{color:var(--head)}
.rdy th.sortable[aria-sort="ascending"] .arr,.rdy th.sortable[aria-sort="descending"] .arr{opacity:1;color:var(--accent)}
/* sortable product-section tables: the button keeps the header's own alignment and sub-label */
section.prog th.sortable{padding:0}
section.prog th.sortable button{appearance:none;background:none;border:0;margin:0;width:100%;font:inherit;
  letter-spacing:inherit;text-transform:inherit;color:inherit;text-align:inherit;cursor:pointer;
  padding:10px 10px 8px;display:block}
section.prog th.sortable button:hover{color:var(--ink)}
section.prog th.sortable button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:4px}
section.prog th.sortable .arr{font-size:10px;letter-spacing:0;opacity:.4;margin-left:4px}
section.prog th.sortable[aria-sort="ascending"] button,section.prog th.sortable[aria-sort="descending"] button{color:var(--head)}
section.prog th.sortable[aria-sort="ascending"] .arr,section.prog th.sortable[aria-sort="descending"] .arr{opacity:1;color:var(--accent)}

/* client roster table */
.roster td .dots{display:inline-flex;gap:4px;vertical-align:middle}
.roster td .dots i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.roster td .dots i.off{background:var(--track)}

/* tooltip */
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--head);color:var(--bg);font-size:12.5px;line-height:1.35;padding:7px 10px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:280px;opacity:0;transition:opacity .08s;font-variant-numeric:tabular-nums}
#tip.on{opacity:1}
#tip b{font-family:Montserrat,sans-serif;font-size:12px;display:block;margin-bottom:2px}
:root[data-theme="dark"] #tip, :root:not([data-theme="light"]) #tip{color:var(--bg)}
footer{color:var(--ink3);font-size:12.5px;margin-top:10px;line-height:1.5;max-width:80ch}
footer p{margin:4px 0}
footer ul.prov{margin:6px 0 8px;padding-left:18px}
footer ul.prov li{margin:3px 0}
footer ul.prov b{color:var(--ink2);font-family:Montserrat,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">CSI Velocity &middot; Retail Performance Engine</div>
      <h1>RPE Client Performance</h1>
      <div class="updated" id="updated"></div>
      <a class="doclink" href="workflow.html">How the decks are made &rarr;</a>
    </div>
    <div class="pill" id="periodpill"></div>
  </header>

  <div class="filters" role="group" aria-label="Filters">
    <div class="frow">
      <span class="eyebrow">CSM</span>
      <div class="chips"><button type="button" class="chip all" id="resetCsm" aria-pressed="true">All</button><span class="chipset" id="csmchips"></span></div>
    </div>
    <div class="frow">
      <span class="eyebrow">Products</span>
      <div class="chips"><button type="button" class="chip all" id="resetProg" aria-pressed="true">All</button><span class="chipset" id="progchips"></span></div>
    </div>
    <div class="frow">
      <span class="eyebrow">Clients</span>
      <div class="chips"><button type="button" class="chip all" id="resetClient" aria-pressed="true">All</button><button type="button" class="chip fold" id="toggleClients" aria-expanded="false" aria-controls="clientchips">Show clients</button><span class="chipset" id="clientchips" hidden></span></div>
    </div>
    <div class="fkey"><span><i style="background:var(--chip-all);border-color:var(--chip-all-line)"></i>Whole row selected</span><span><i style="background:var(--chip-on);border-color:var(--chip-on)"></i>Selected</span><span><i style="background:var(--chip-off);border-color:var(--hair)"></i>Not selected</span></div>
  </div>

  <div class="strip" id="strip"></div>
  <div id="sections"></div>
  <section class="prog roster rdy" id="rostersec"></section>
  <footer id="foot"></footer>
</div>
<div id="tip" role="tooltip"></div>
<div id="note" role="status" aria-live="polite"></div>

<script>
const DATA = __DATA__;
const PROGS = [
  {k:"ARS", name:"Account Revenue Solution", short:"ARS", c:"var(--ars)"},
  {k:"ICS", name:"Invitation Checking System", short:"ICS", c:"var(--ics)"},
  {k:"MRPC", name:"MyRewards Premium Cards", short:"MRPC", c:"var(--mrpc)"},
  {k:"CP", name:"CashPlease", short:"CashPlease", c:"var(--cp)"},
];
const PK = Object.fromEntries(PROGS.map(p=>[p.k,p]));
const clients = DATA.clients;

// ---------- sent state
// deliveries.json is the record, and DATA carries it. A click here writes a row
// to this artifact's own store instead of guessing: the morning refresh folds
// those rows into deliveries.json, so the page never becomes a second ledger.
// Sent is keyed on the DECK's period, not the cycle's - the same key the log uses.
let DB = null;            // db namespace once it resolves; null = this view cannot write
let MARKS = new Map();    // docId -> row recorded from the page (a send, or an undo)
const BUSY = new Set();   // docId mid-write
let ARMED = null;         // docId whose sent date was clicked once and awaits the confirming click
let armTimer = null;
const ARM_MS = 5000;

function today(){ const d=new Date(), p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
const sentDoc = c => c.deck_period ? `${c.id}-${c.deck_period}` : null;
// A page row that names the logged date it supersedes ("undo_of") overrides that date:
// an undo row clears it, a send row replaces it. A row naming any OTHER date is stale
// and the log stands - the refresh applies exactly the same rule to deliveries.json.
function sentState(c){
  const k = sentDoc(c), m = (k && MARKS.get(k)) || null;
  const supersedes = !!(m && c.sent && m.undo_of != null && String(m.undo_of) === String(c.sent));
  if (c.sent && !supersedes) return {date:String(c.sent), src:"log"};
  if (m && !m.unsent && m.sent_at) return {date:String(m.sent_at), src:"page"};
  return null;
}
function disarm(){
  clearTimeout(armTimer); armTimer = null;
  if (ARMED !== null){ ARMED = null; update(); }
}
function refocus(attr, id){
  const el = [...document.querySelectorAll(`[${attr}]`)].find(b => b.getAttribute(attr) === id);
  if (el) el.focus();
}

let noteTimer = null;
function note(msg){
  const n = document.getElementById("note");
  n.textContent = msg; n.classList.add("on");
  clearTimeout(noteTimer); noteTimer = setTimeout(()=>n.classList.remove("on"), 6000);
}
function whyFailed(err){
  switch (err && err.code){
    case "not_granted": case "capability_disabled": case "capability_removed":
      return "This view cannot record sends.";
    case "invalid_argument": return "The record was rejected as malformed.";
    case "resource_exhausted": return "Too many writes at once \u2014 wait a moment and click again.";
    case "quota_exceeded": return "The page's store is full.";
    case "revoked": return "Access was withdrawn \u2014 reload the page.";
    case "unavailable": return "The store is briefly unreachable \u2014 click again.";
    default: return "Nothing was recorded.";
  }
}

function sentCell(c){
  const s = sentState(c), k = sentDoc(c);
  if (k && BUSY.has(k)) return `<button class="tag" disabled>saving\u2026</button>`;
  if (s){
    if (!DB) return `<span class="tag good">sent ${esc(s.date)}</span>`;
    if (ARMED === k) return `<button class="tag confirm" data-unsend="${esc(k)}" ` +
      `title="Click again to remove the ${esc(s.date)} send record. Click anywhere else or press Esc to keep it.">Undo send?</button>`;
    return `<button class="tag good" data-unsend="${esc(k)}" ` +
      `title="Sent ${esc(s.date)} \u2014 click to undo">sent ${esc(s.date)}</button>`;
  }
  if (!c.decks.length) return `<span class="tag" title="no deck has been built for this client yet">not recorded</span>`;
  if (!DB) return `<span class="tag">not recorded</span>`;
  return `<button class="tag" data-mark="${esc(k)}" title="Not recorded \u2014 click to record this deck as sent today">Mark sent</button>`;
}

document.addEventListener("keydown", e => { if (e.key === "Escape" && ARMED !== null) disarm(); });

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-mark],[data-unsend]");
  if (!el){ if (ARMED !== null) disarm(); return; }
  if (!DB) return;
  const id = el.dataset.mark || el.dataset.unsend, marking = !!el.dataset.mark;
  const c = clients.find(x => sentDoc(x) === id);
  if (!c || BUSY.has(id)) return;

  // Undo takes two clicks. The first only arms the button - nothing is written - and it
  // disarms on its own after ARM_MS, on Esc, or on a click anywhere else.
  if (!marking && ARMED !== id){
    clearTimeout(armTimer);
    ARMED = id; update(); refocus("data-unsend", id);
    armTimer = setTimeout(disarm, ARM_MS);
    return;
  }
  const s = sentState(c);
  clearTimeout(armTimer); armTimer = null; ARMED = null;
  BUSY.add(id); update();
  const stamp = {client_id:c.id, period:c.deck_period, deck:c.decks[0] || "",
                 by:"artifact page", recorded_at:new Date().toISOString()};
  try {
    let row;
    if (marking){
      row = Object.assign({sent_at:today()}, stamp);
      // Marking over a logged date that was undone: name that date, so the refresh
      // replaces it rather than keeping the old one because an entry already exists.
      if (c.sent) row.undo_of = String(c.sent);
      await DB.doc("deliveries/"+id).set(row);
      note(`${c.name} recorded as sent ${row.sent_at}.`);
    } else {
      // An undo is a row, not a deletion: the send may already be in deliveries.json,
      // which only the refresh can change. It names the date it cancels - the logged date
      // when there is one - so it can never remove a send recorded after it.
      const was = String(c.sent || (s && s.date) || "");
      row = Object.assign({unsent:true, undo_of:was}, stamp);
      await DB.doc("deliveries/"+id).set(row);
      note(`${c.name}: the ${was} send record is removed.`);
    }
    MARKS.set(id, row);
  } catch (err) {
    note(`${marking ? "Could not record" : "Could not undo"} ${c.name}. ${whyFailed(err)}`);
  } finally {
    BUSY.delete(id); update();
    refocus(marking ? "data-unsend" : "data-mark", id);
  }
});

(async function initDb(){
  const use = (typeof window !== "undefined" && window.claude && window.claude.use);
  if (typeof use !== "function") return;          // saved copy or plain host: read-only
  let db = null;
  try { db = await window.claude.use("db"); } catch(e){ db = null; }
  if (!db) return;                                 // not granted / not served: read-only
  DB = db;
  try {
    db.collection("deliveries").onSnapshot(
      snap => { MARKS = new Map(snap.docs.filter(d=>d.exists).map(d => [d.id, d.data()||{}]));
                update(); },
      err  => note(`Sent records could not be loaded (${(err&&err.code)||"unknown"}); what you see may be out of date.`)
    );
  } catch(e){ /* no live updates; the buttons still write */ }
  update();                                        // reveal the buttons
})();

// ---------- CSM
// Who owns a client comes from the data - the reports share's account-manager folders,
// resolved by the refresh - never from this page. A client with no known CSM is grouped
// as Unassigned and says so, rather than being filed under whoever seems likely.
const UNASSIGNED = "Unassigned";
const csmOf = c => c.csm || UNASSIGNED;
const CSMS = [...new Set(clients.map(csmOf))]
  .sort((a,b)=>(a===UNASSIGNED)-(b===UNASSIGNED) || a.localeCompare(b));

// ---------- state
let selCsms = new Set(CSMS);
let selProgs = new Set(PROGS.map(p=>p.k));
let selClients = new Set(clients.map(c=>c.id));
// "All" is saved as null, never as the list it happened to be. The page gains clients and
// CSMs over time, and a saved list of yesterday's "all" would silently hide every newcomer:
// the first all-clients build opened on Aaron's 20 because "all" had been saved as those 20.
// The key is versioned so selections saved under the old rule are ignored.
const FILTER_KEY = "rpe-dash-filter-v2";
try {
  const s = JSON.parse(localStorage.getItem(FILTER_KEY)||"null");
  if (s) {
    // null = all (the default). [] = a deliberate empty selection (Aaron, 2026-09-14: allow
    // zero). A saved list whose every entry has since gone falls back to all, because that
    // blank page would have no visible cause.
    const restore = (saved, valid) => {
      if (!Array.isArray(saved)) return null;
      if (!saved.length) return new Set();
      const kept = saved.filter(valid);
      return kept.length ? new Set(kept) : null;
    };
    selProgs = restore(s.p, k=>PK[k]) || selProgs;
    selClients = restore(s.c, id=>clients.some(x=>x.id===id)) || selClients;
    selCsms = restore(s.m, k=>CSMS.includes(k)) || selCsms;
  }
} catch(e){}
// A saved client selection with nobody under the saved CSMs is stale, not a choice: reset it
// once, here on load. It used to be reset on every render, which undid a deliberate empty one.
if (selClients.size && selCsms.size && !clients.some(c=>selCsms.has(csmOf(c)) && selClients.has(c.id)))
  selClients = new Set(clients.map(c=>c.id));
function persist(){
  const pick = (set, n) => set.size===n ? null : [...set];
  try{ localStorage.setItem(FILTER_KEY, JSON.stringify({m:pick(selCsms, CSMS.length), p:pick(selProgs, PROGS.length), c:pick(selClients, clients.length)})); }catch(e){}
}
const inCsm = c => selCsms.has(csmOf(c));
// A client with no program data this month is still a current client: it is listed while
// every product is selected, and has no product to match once products are narrowed.
const inProducts = c => c.programs.length ? c.programs.some(k=>selProgs.has(k)) : selProgs.size===PROGS.length;

// Build readiness sort: one column at a time, ascending -> descending -> off.
// Off is client id order, the order the data arrives in, so the table can always
// be put back the way it was. Per viewer, so it lives in localStorage, and a stored
// value this page does not recognise is ignored rather than trusted.
const RSORT_KEYS = ["client","products","ready","inputs","deck","sent"];
let rSort = {k:null, dir:1};
try {
  const s = JSON.parse(localStorage.getItem("rpe-dash-rsort")||"null");
  if (s && RSORT_KEYS.includes(s.k) && (s.dir===1 || s.dir===-1)) rSort = {k:s.k, dir:s.dir};
} catch(e){}
function persistSort(){ try{ localStorage.setItem("rpe-dash-rsort", JSON.stringify(rSort)); }catch(e){} }

// ---------- formatters
const nf0 = new Intl.NumberFormat("en-US",{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat("en-US",{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const N = v => v==null||isNaN(v) ? "\u2014" : nf0.format(v);
const N1 = v => v==null||isNaN(v) ? "\u2014" : nf1.format(v);
const USD = v => v==null||isNaN(v) ? "\u2014" : (v<0?"\u2212":"")+"$"+nf0.format(Math.abs(v));
const USDk = v => { if(v==null||isNaN(v)) return "\u2014"; const a=Math.abs(v), s=v<0?"\u2212":""; if(a>=1e6) return s+"$"+nf2.format(a/1e6).replace(/\.?0+$/,"")+"M"; if(a>=1e4) return s+"$"+nf0.format(a/1e3)+"K"; return s+"$"+nf0.format(a); };
const PCT = (v,d=1) => v==null||isNaN(v) ? "\u2014" : new Intl.NumberFormat("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}).format(v)+"%";
const PCTf = (v,d=1) => v==null||isNaN(v) ? "\u2014" : PCT(v*100,d);
const monLabel = m => { // "2026-08" -> "Aug '26"
  if(!m) return ""; const [y,mm]=m.split("-"); const names=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return names[+mm-1]+" \u2019"+y.slice(2); };
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- tooltip
const tip = document.getElementById("tip");
function showTip(html, e){ tip.innerHTML = html; tip.classList.add("on"); moveTip(e); }
function moveTip(e){ const x=e.clientX, y=e.clientY; const w=tip.offsetWidth, h=tip.offsetHeight;
  tip.style.left = Math.min(x+14, window.innerWidth-w-8)+"px"; tip.style.top = (y+16+h>window.innerHeight? y-h-10 : y+16)+"px"; }
function hideTip(){ tip.classList.remove("on"); }
document.addEventListener("mouseover", e=>{ const t=e.target.closest("[data-tip]"); if(t) showTip(t.dataset.tip, e); });
document.addEventListener("mousemove", e=>{ if(tip.classList.contains("on")) moveTip(e); });
document.addEventListener("mouseout", e=>{ const t=e.target.closest("[data-tip]"); if(t && !t.contains(e.relatedTarget)) hideTip(); });

// ---------- sparkline (SVG)
function spark(series, opts={}){
  // series: [{label, v}], opts: {c, goal:[..], partialLast}
  const vals = series.map(s=>s.v).filter(v=>v!=null);
  if(!vals.length) return `<span class="dim">\u2014</span>`;
  const W=120,H=32,px=3,py=4; const n=series.length;
  const gvals = opts.goal ? opts.goal.filter(v=>v!=null) : [];
  const max = Math.max(...vals, ...gvals, 1), min = Math.min(0, ...vals);
  const x = i => n===1 ? W/2 : px + i*(W-2*px)/(n-1);
  const y = v => H-py - (v-min)/(max-min||1)*(H-2*py);
  let d="", area="";
  series.forEach((s,i)=>{ if(s.v==null) return; d += (d?" L":"M")+x(i).toFixed(1)+" "+y(s.v).toFixed(1); });
  const first = series.findIndex(s=>s.v!=null), last = n-1-[...series].reverse().findIndex(s=>s.v!=null);
  area = d + ` L${x(last).toFixed(1)} ${y(min).toFixed(1)} L${x(first).toFixed(1)} ${y(min).toFixed(1)} Z`;
  let g="";
  if(opts.goal){ let gd=""; opts.goal.forEach((v,i)=>{ if(v==null) return; gd += (gd?" L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1); }); g=`<path class="gl" d="${gd}"/>`; }
  const lastV = series[last].v;
  const end = `<circle class="${opts.partialLast?'pt':''}" cx="${x(last).toFixed(1)}" cy="${y(lastV).toFixed(1)}" r="2.6"/>`;
  const step = n>1 ? (W-2*px)/(n-1) : W-2*px;
  const hits = series.map((s,i)=> s.v==null?"" : `<rect class="hit" x="${(x(i)-step/2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${H}" data-tip="<b>${esc(s.label)}</b>${esc(opts.fmt?opts.fmt(s.v):N(s.v))}${opts.goal&&opts.goal[i]!=null?' \u00b7 goal '+esc(N(opts.goal[i])):''}${s.note?'<br>'+esc(s.note):''}"/>`).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" style="--c:${opts.c}" role="img" aria-label="${esc(opts.aria||'trend')}"><path class="ar" d="${area}"/>${g}<path class="ln" d="${d}"/>${end}${hits}</svg>`;
}

// ---------- ranked bars
function bars(rows, opts={}){
  // rows: [{name, id, v, tipHtml, marker?}] ; opts: {c, fmt, max}
  const valid = rows.filter(r=>r.v!=null);
  if(!valid.length) return `<div class="empty">No figures for the selected clients.</div>`;
  const max = opts.max ?? Math.max(...valid.map(r=>Math.abs(r.v)), ...(valid.map(r=>r.marker??0)));
  return `<div class="bars" style="--c:${opts.c}">` + valid.sort((a,b)=>b.v-a.v).map(r=>{
    const w = Math.max(0, Math.abs(r.v)/(max||1)*100);
    const mk = r.marker!=null ? `<span class="mk" style="left:${(r.marker/(max||1)*100).toFixed(1)}%"></span>` : "";
    return `<div class="hit" data-tip="${esc(r.tipHtml||'')}"><span class="nm">${esc(r.name)}</span><span class="tr"><span class="bar ${r.v<0?'neg':''}" style="width:${w.toFixed(1)}%"></span>${mk}</span><span class="vl">${opts.fmt(r.v)}</span></div>`;
  }).join("") + `</div>`;
}

// ---------- filters UI
// The All chip leading each row is green while its whole row is selected.
function markAllChips(){
  const scoped = clients.filter(inCsm);
  [["resetCsm", selCsms.size===CSMS.length], ["resetProg", selProgs.size===PROGS.length],
   ["resetClient", scoped.length>0 && scoped.every(c=>selClients.has(c.id))]].forEach(([id, on])=>{
    const b = document.getElementById(id);
    b.classList.toggle("in", on); b.setAttribute("aria-pressed", String(on));
  });
}
// The Clients row runs to ninety chips across every CSM, so it folds (Aaron, 2026-09-14).
// Closed by default and remembered per viewer; closed, the toggle says how far the row is narrowed.
const FOLD_KEY = "rpe-dash-clients-open";
let clientsOpen = false;
try { clientsOpen = localStorage.getItem(FOLD_KEY) === "1"; } catch(e){}
function renderClientFold(){
  const b = document.getElementById("toggleClients"), set = document.getElementById("clientchips");
  const scoped = clients.filter(inCsm), picked = scoped.filter(c=>selClients.has(c.id)).length;
  set.hidden = !clientsOpen;
  b.setAttribute("aria-expanded", String(clientsOpen));
  b.textContent = clientsOpen ? "Hide clients"
    : (picked === scoped.length ? `Show ${scoped.length} clients` : `Show clients (${picked} of ${scoped.length} selected)`);
}
document.getElementById("toggleClients").onclick = ()=>{
  clientsOpen = !clientsOpen;
  try { localStorage.setItem(FOLD_KEY, clientsOpen ? "1" : "0"); } catch(e){}
  renderClientFold();
};
function renderChips(){
  const mc = document.getElementById("csmchips");
  const allM = selCsms.size===CSMS.length;
  mc.innerHTML = CSMS.map(m=>{
    const n = clients.filter(c=>csmOf(c)===m).length;
    const tip = m===UNASSIGNED ? "No account-manager folder, clients.md CSM column or settings record names a CSM for these clients" : `${n} client${n===1?"":"s"}`;
    return `<button class="chip ${allM?'in':(selCsms.has(m)?'on':'')}" data-csm="${esc(m)}" aria-pressed="${selCsms.has(m)}" title="${esc(tip)}">${esc(m)}<span class="ct">${n}</span></button>`;
  }).join("");
  const pc = document.getElementById("progchips");
  const scoped = clients.filter(inCsm);
  const allP = selProgs.size===PROGS.length, allC = scoped.every(c=>selClients.has(c.id));
  pc.innerHTML = PROGS.map(p=>`<button class="chip ${allP?'in':(selProgs.has(p.k)?'on':'')}" data-prog="${p.k}" style="--c:${p.c}" aria-pressed="${selProgs.has(p.k)}"><span class="sw"></span>${p.short}</button>`).join("");
  const cc = document.getElementById("clientchips");
  // Only the selected CSMs' clients are offered: across every CSM the full list is
  // around ninety chips, and a client outside the selection could not be shown anyway.
  cc.innerHTML = scoped.map(c=>{
    const inProg = inProducts(c);
    return `<button class="chip ${allC?'in':(selClients.has(c.id)?'on':'')} ${inProg?'':'off'}" data-client="${c.id}" aria-pressed="${selClients.has(c.id)}" title="${esc(c.programs.join(' \u00b7 '))}">${esc(c.name)}<span class="tags">${c.programs.map(k=>`<i style="--c:${PK[k].c}"></i>`).join("")}</span></button>`;
  }).join("");
}
document.getElementById("progchips").addEventListener("click", e=>{
  const b=e.target.closest("[data-prog]"); if(!b) return;
  const k=b.dataset.prog;
  // Same model as the CSM and client chips (Aaron, 2026-09-14): from "all", a click shows
  // only that product; later clicks add or remove others. It used to REMOVE the clicked
  // product from "all", the opposite of every other filter row.
  const all = selProgs.size===PROGS.length;
  if(e.shiftKey || e.altKey || all){ selProgs = new Set([k]); }
  else if(selProgs.has(k)) selProgs.delete(k); else selProgs.add(k);
  update();
});
// CSM chips work like the client chips: from "all", a click isolates that CSM; after
// that, clicks add and remove. Changing the CSM resets the client selection, because a
// client picked under one CSM would otherwise leave another CSM's view empty.
document.getElementById("csmchips").addEventListener("click", e=>{
  const b=e.target.closest("[data-csm]"); if(!b) return;
  const m=b.dataset.csm;
  const all = selCsms.size===CSMS.length;
  if(e.shiftKey || e.altKey || all){ selCsms = new Set([m]); }
  else if(selCsms.has(m)) selCsms.delete(m); else selCsms.add(m);
  selClients = new Set(clients.map(c=>c.id));
  update();
});
document.getElementById("resetCsm").onclick = ()=>{ selCsms = new Set(CSMS); selClients = new Set(clients.map(c=>c.id)); update(); };
document.getElementById("clientchips").addEventListener("click", e=>{
  const b=e.target.closest("[data-client]"); if(!b) return;
  const id=b.dataset.client;
  const all = clients.filter(inCsm).every(c=>selClients.has(c.id));
  if(e.shiftKey || e.altKey || all){ selClients = new Set([id]); }
  else if(selClients.has(id)) selClients.delete(id); else selClients.add(id);
  update();
});
document.getElementById("resetProg").onclick = ()=>{ selProgs = new Set(PROGS.map(p=>p.k)); update(); };
document.getElementById("resetClient").onclick = ()=>{ selClients = new Set(clients.map(c=>c.id)); update(); };

// ---------- summary strip
function renderStrip(vis){
  const on = k => selProgs.has(k);
  const sum = (arr,f) => arr.reduce((a,c)=>a+(f(c)||0),0);
  const ars = vis.filter(c=>c.ars && !c.ars.missing && on("ARS"));
  const ics = vis.filter(c=>c.ics && !c.ics.missing && on("ICS"));
  const mrpc = vis.filter(c=>c.mrpc && on("MRPC"));
  const cp = vis.filter(c=>c.cp && !c.cp.missing && on("CP"));
  const tiles = [];
  const csmLabel = selCsms.size===CSMS.length ? "" : (selCsms.size===1 ? [...selCsms][0] : `${selCsms.size} CSMs`) + " \u00b7 ";
  tiles.push({e:"Selection", v:`${vis.length}`, l:`client${vis.length===1?"":"s"} \u00b7 ${esc(csmLabel)}${[...selProgs].length} of 4 products`, c:"var(--muted)"});
  const ov = vis.filter(c=>c.overview && !c.overview.missing);
  if(ov.length) tiles.push({e:"Overview", v:N(sum(ov,c=>c.overview.open_total)), l:`open checking accounts \u00b7 ${ov.length} client${ov.length===1?"":"s"}`, c:"var(--ov)"});
  // Only clients whose extract carries the figure: sum() reads a missing value as 0, and a $0 tile
  // would pass for a month in which CSI earned nothing.
  const csi = ars.filter(c=>c.ars.csi_revenue!=null);
  if(csi.length) tiles.push({e:"ARS", v:USDk(sum(csi,c=>c.ars.csi_revenue)), l:`revenue to CSI, ${csi[0].ars.data_label.replace(" Data","")}`, c:"var(--ars)"});
  if(ics.length) tiles.push({e:"ICS", v:N(sum(ics,c=>c.ics.ytd)), l:"referrals year to date", c:"var(--ics)"},
                            {e:"ICS", v:N(sum(ics,c=>c.ics.prev_month?.value)), l:`referrals in ${ics[0].ics.prev_month?.label||"last month"} \u00b7 goal ${N(sum(ics,c=>c.ics.monthly_goal))}`, c:"var(--ics)"});
  if(mrpc.length) tiles.push({e:"MRPC", v:N(sum(mrpc,c=>c.mrpc.weekly?.active_cardholders)), l:"active premium cardholders", c:"var(--mrpc)"},
                             {e:"MRPC", v:N(sum(mrpc,c=>{const m=c.mrpc.weekly?.monthly; return m?.length?m[m.length-1].platinum+m[m.length-1].gold+m[m.length-1].business:0;})), l:`enrollments, ${monLabel(mrpc[0].mrpc.weekly?.monthly?.slice(-1)[0]?.month)}`, c:"var(--mrpc)"});
  if(cp.length) tiles.push({e:"CashPlease", v:N(sum(cp,c=>c.cp.window_loans)), l:"loans, trailing 12 months", c:"var(--cp)"},
                           {e:"CashPlease", v:USDk(sum(cp,c=>c.cp.active_principal)), l:"principal outstanding on active loans", c:"var(--cp)"});
  document.getElementById("strip").innerHTML = tiles.map(t=>`<div class="stat" style="--c:${t.c}"><div class="e">${t.e}</div><div class="v">${t.v}</div><div class="l">${t.l}</div></div>`).join("");
}

// ---------- sections
function secShell(p, n, src, rankHtml, tableHtml){
  return `<section class="prog" data-sec="${esc(p.k || p.name)}" style="--c:${p.c}">
    <div class="hd"><h2><span class="sw"></span>${p.name}</h2><span class="n">${n} client${n===1?"":"s"}</span><span class="src">${esc(src)}</span></div>

// ---------- CSM action items (Aaron, 2026-09-15)
// Current ARS clients only: a Lift Matrix the data team flags as out of date in the workbook's
// filename, and ODD codes the client's code tables in the ARS database do not list. Nothing is
// mapped here or in the pipeline; the CSM has the client correct the code sheet
// (scripts/perf_actions.py). Terms follow the VIP Data Specification.
// Product (with its Personal/Business flag) and Account Status decide ARS eligibility, so they come
// first; Mail Flag decides who is mailed, not eligibility (tested on 12 clients); Reg E neither
// (Aaron, 2026-09-15).
const ACT_KINDS = [
  ["product", "Product Codes not mapped", "correct the product mapping on the client's code sheet; it determines ARS eligibility"],
  ["pb_flag", "Product codes with no Personal/Business flag", "correct the product mapping on the client's code sheet; it determines ARS eligibility"],
  ["status", "Account Status Codes not mapped", "correct on the client's code sheet; it determines ARS eligibility"],
  ["mail", "Mail Flags not mapped", "correct on the client's code sheet; it decides who is mailed"],
  ["reg_e", "Reg E Codes not mapped", "correct on the client's code sheet"]];
function actCell(item){
  if(!item) return `<span class="dim">&mdash;</span>`;
  const label = v => v.value === "" ? "(blank)" : v.value;
  const shown = item.values.slice(0, 4), more = item.values.length - shown.length;
  const all = item.values.map(v => `${label(v)}: ${v.accounts} accounts, ${v.open} open${v.desc ? " (" + v.desc + ")" : ""}`).join("; ");
  return (item.no_table ? `<span class="tag warn" title="The ARS database has no table of these codes for this client, so every value is listed">no table</span>` : "") +
    shown.map(v => `<span class="av" title="${esc(N(v.open))} open"><code>${esc(label(v))}</code> ${N(v.accounts)}${v.desc ? ` <span class="dim">${esc(v.desc)}</span>` : ""}</span>`).join("") +
    (more > 0 ? `<span class="sub" title="${esc(all)}">+${more} more</span>` : "");
}
function secActions(vis){
  const p = {name:"CSM action items", c:"var(--warn)"};
  const ars = vis.filter(c=>c.actions);
  if(!ars.length) return "";
  const has = (c,k) => k === "lm" ? !!c.actions.lift_matrix : c.actions.codes.some(x=>x.kind===k);
  const rows = ars.filter(c=>c.actions.count || c.actions.unchecked.length);
  const unchecked = ars.filter(c=>c.actions.unchecked.length).length;
  const count = k => ars.filter(c=>has(c,k)).length;
  const li = (k, label, todo) => { const n = count(k);
    return `<li><b class="${n?"":"zero"}">${n}</b><span>${label}</span><span class="sub">CSM: ${todo}</span></li>`; };
  const rank = `<h3>What needs a CSM</h3><div class="cap">Clients with each item, of ${ars.length} current ARS client${ars.length===1?"":"s"} checked. A count is value by value against the client's code tables in the ARS database; nothing is mapped for them.</div>` +
    `<ul class="acts">${li("lm", "Lift Matrix out of date", "create a new lift matrix")}${ACT_KINDS.map(([k,l,t])=>li(k,l,t)).join("")}</ul>` +
    (unchecked ? `<div class="cap" style="margin-top:12px">${unchecked} client${unchecked===1?"":"s"} could not be checked for codes; each row says why.</div>` : "");
  const sub = s => `<br><span style="font-weight:500;text-transform:none;letter-spacing:0">${s}</span>`;
  const table = !rows.length ? `<div class="empty">Nothing to act on for the selected clients.</div>` :
    `<table><thead><tr><th class="l">Client</th><th class="l">CSM</th><th class="l">Lift Matrix</th>` +
    ACT_KINDS.map(([k,l])=>`<th class="l">${l}${sub("value, accounts")}</th>`).join("") + `</tr></thead><tbody>` +
    rows.map(c=>{ const a = c.actions, by = Object.fromEntries(a.codes.map(x=>[x.kind, x]));
      return `<tr>
        <td class="l"><span class="cl">${esc(c.name)}</span><span class="id">${c.id}</span>${a.odd_month?`<span class="sub">ODD ${esc(a.odd_month)}</span>`:""}${a.unchecked.map(u=>`<span class="sub dim">${esc(u)}</span>`).join("")}</td>
        <td class="l">${esc(c.csm || "Unassigned")}</td>
        <td class="l">${a.lift_matrix ? `<span class="tag warn" title="${esc(a.lift_matrix.workbook)}">${esc(a.lift_matrix.flag)}</span><span class="sub">create a new lift matrix</span>` : `<span class="dim">&mdash;</span>`}</td>
        ${ACT_KINDS.map(([k])=>`<td class="l">${actCell(by[k])}</td>`).join("")}</tr>`;
    }).join("") + `</tbody></table>`;
  return secShell(p, rows.length, "ARS workbook filenames + the ARS database code tables", rank, table);
}

  return (PK[k]||{}).c || "var(--muted)";

// Each column sorts on what it MEANS, not on its markup: Ready puts ready before
// blocked, Inputs counts what is missing, Deck puts this period's build first, Sent
// puts what still needs sending first. A row the column does not apply to - no
// readiness check (the CashPlease-only clients), no deck to send - returns null and
// stays at the bottom in BOTH directions, so flipping a sort never floods the top of
// the table with blanks.
function rosterKey(c, k){
  const P = DATA.period, r = c.readiness;
  switch (k){
    case "client":   return [String(c.name||"").toLowerCase()];
    case "products": return [...PROGS.map(p=>c.programs.includes(p.k)?0:1), -c.programs.length];
    case "ready":    return r ? [r.ready?0:1, r.blocked_on.length] : null;
    case "inputs": {
      if (!r) return null;
      const n = st => r.inputs.filter(i=>String(i.state||"").toLowerCase()===st).length;
      return [n("missing"), n("stale"), r.inputs.length - n("present") - n("missing") - n("stale")];
    }
    // No deck at all is NOT "not applicable" here - it is the state this column exists
    // to show - so it is the last rank rather than null, and descending puts it first.
    // Treated as null it sat at the bottom both ways, and since every built deck ties,
    // descending rendered exactly like ascending and the click looked broken.
    case "deck":     return c.deck_period===P ? [0, ""] : (c.decks.length ? [1, String(c.deck_period||"")] : [2, ""]);
    case "sent": {
      const s = sentState(c);
      if (s) return [1, String(s.date)];
      return c.decks.length ? [0, ""] : null;
    }
  }
  return [0];
}
function cmpKeys(a, b){
  for (let i=0; i<Math.max(a.length, b.length); i++){
    const x=a[i], y=b[i];
    if (x===y) continue;
    if (x===undefined) return -1;
    if (y===undefined) return 1;
    return (typeof x==="number" && typeof y==="number") ? x-y : String(x).localeCompare(String(y));
  }
  return 0;
}
function sortRoster(rows){
  if (!rSort.k) return rows;
  const byId = (a,b)=>String(a.id).localeCompare(String(b.id), undefined, {numeric:true});
  return rows.map(c=>({c, key:rosterKey(c, rSort.k)})).sort((a,b)=>{
    if (!a.key !== !b.key) return a.key ? -1 : 1;             // not applicable: always last
    const d = a.key ? cmpKeys(a.key, b.key) * rSort.dir : 0;
    // Ties fall back to the client's name, then id, in a fixed direction, so rows that
    // compare equal do not reshuffle every time the column is flipped.
    return d || String(a.c.name).localeCompare(String(b.c.name)) || byId(a.c, b.c);
  }).map(x=>x.c);
}
function sortTh(k, label){
  const on = rSort.k===k;
  const aria = on ? (rSort.dir===1 ? "ascending" : "descending") : "none";
  const arr = on ? (rSort.dir===1 ? "\u25b2" : "\u25bc") : "\u2195";
  const hint = !on ? "Click to sort"
    : (rSort.dir===1 ? "Sorted ascending \u2014 click for descending" : "Sorted descending \u2014 click to clear the sort");
  return `<th class="l sortable" aria-sort="${aria}"><button type="button" data-rsort="${k}" title="${hint}">` +
    `${label}<span class="arr" aria-hidden="true">${arr}</span></button></th>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-rsort]");
  if (!b) return;
  const k = b.dataset.rsort;
  if (!RSORT_KEYS.includes(k)) return;
  if (rSort.k !== k) rSort = {k, dir:1};
  else if (rSort.dir === 1) rSort = {k, dir:-1};
  else rSort = {k:null, dir:1};
  persistSort(); update();
  // The table is re-rendered, so the button that was clicked no longer exists; put
  // keyboard focus back on its replacement or a keyboard user is dropped to the top.
  const again = document.querySelector(`[data-rsort="${k}"]`);
  if (again) again.focus();
});

// Build readiness for THIS period. The section used to list the newest deck
// BUILT; what you need at the start of a cycle is what can be built and what is
// missing (Aaron, 2026-09-09). deck_status owns the answer, so this page and the
// delivery dashboard cannot disagree.
function secRoster(vis){
  const P = DATA.period;
  const withR = vis.filter(c=>c.readiness);
  const ready = withR.filter(c=>c.readiness.ready).length;
  const built = vis.filter(c=>c.deck_period===P).length;
  const h = `<div class="hd"><h2>Build readiness \u00b7 ${esc(P)}</h2>` +
    `<span class="n">${ready} of ${withR.length} ready \u00b7 ${built} built</span>` +
    `<span class="src">clients.md, Inputs/ and the delivery log</span></div>`;
  const t = `<div class="tbl" style="padding:6px 8px 12px"><table><thead><tr>` +
    sortTh("client", "Client") + sortTh("products", "Products") + sortTh("ready", "Ready to build") +
    sortTh("inputs", `Inputs for ${esc(P)}`) + sortTh("deck", "Deck") + sortTh("sent", "Sent") +
    `</tr></thead><tbody>` +
    sortRoster(vis).map(c=>{
      const r = c.readiness;
      const dots = `<span class="dots">${PROGS.map(p=>`<i class="${c.programs.includes(p.k)?'':'off'}" style="--c:${p.c}" title="${p.short}"></i>`).join("")}</span>` +
        ` <span class="dim" style="margin-left:6px">${c.programs.map(k=>PK[k].short).join(" \u00b7 ")}</span>`;
      // Programs for a client clients.md does not list are inferred from this month's files.
      const progNote = (c.programs.length ? "" : `<span class="dim">no program data this month</span>`) +
        (c.programs_from === "data" ? ` <span class="tag" title="Not in clients.md: programs inferred from this month's files on the reports share">from data</span>` : "");
      let state, ins;
      if (!r){
        state = `<span class="st unk"><i></i>not checked</span>`;
        ins = `<span class="dim">\u2014</span>`;
      } else if (r.ready){
        state = `<span class="st ok"><i></i>ready</span>`;
        ins = `<div class="ins">${r.inputs.map(i=>chipFor(i)).join("")}</div>`;
      } else {
        state = `<span class="st no"><i></i>blocked</span>` +
          (r.blocked_on.length?`<span class="need">${r.blocked_on.map(esc).join(", ")}</span>`:"");
        ins = `<div class="ins">${r.inputs.map(i=>chipFor(i)).join("")}</div>`;
      }
      const deck = c.deck_period===P
        ? `<span class="tag good">built ${esc(P)}</span>`
        : (c.decks.length?`<span class="tag">newest ${esc(c.deck_period||"")}</span>`
                         :`<span class="tag warn">none</span>`);
      return `<tr>
      <td class="l"><span class="cl">${esc(c.name)}</span><span class="id">${c.id}</span></td>
      <td class="l">${dots}${progNote}</td>
      <td class="l">${state}</td>
      <td class="l" style="white-space:normal;max-width:430px">${ins}</td>
      <td class="l">${deck}</td>
      <td class="l">${sentCell(c)}</td></tr>`;
    }).join("") + `</tbody></table></div>`;
  return h + t;
}

function chipFor(i){
  const st = String(i.state||"").toLowerCase();
  const cls = st==="missing" ? " miss" : (st==="stale" ? " stale" : "");
  const mark = st==="present" ? "" : (st==="missing" ? " \u2717" : (st==="stale" ? " stale" : " ?"));
  return `<span class="in${cls}" style="--c:${inColour(i.program)}" title="${esc((i.program||"")+" \u00b7 "+(i.detail||i.state||""))}">` +
    `<i></i>${esc(i.input||"")}${mark}</span>`;
}

// ---------- update
// One section must never take the page down with it. A CashPlease build that
// could not read the rollup used to throw here, and the throw blanked the whole
// dashboard - every section and the roster - over one missing figure. A section
// that cannot render says so and the rest of the page stands.
// ---------- sortable section tables (Aaron, 2026-09-14: "sort the product columns too, such as by loss rate")
// Every column that carries a value sorts, one column per section, remembered per viewer. A
// numeric column sorts highest first on the first click (so "by loss rate" is one click), a text
// column A to Z; the next click reverses it and the third clears it. The value is read from what
// the cell SHOWS ($1.6M, -$1.2M, 6.85%, 5.75 : 1, Aug 2026), never from its sub-label. A row that
// spans the table (no figures for that client) and the peer row stay at the bottom both ways.
const SSORT_KEY = "rpe-dash-ssort";
let sSort = {};
try { const s = JSON.parse(localStorage.getItem(SSORT_KEY)||"null"); if (s && typeof s === "object" && !Array.isArray(s)) sSort = s; } catch(e){}
function persistSSort(){ try{ localStorage.setItem(SSORT_KEY, JSON.stringify(sSort)); }catch(e){} }
const MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function cellKey(td){
  if (!td || td.colSpan > 1 || td.querySelector("svg")) return null;
  const cl = td.querySelector(".cl");
  if (cl) return cl.textContent.trim().toLowerCase();
  let txt = "";
  td.childNodes.forEach(n => {
    if (n.nodeType === 3 || !(n.classList && (n.classList.contains("sub") || n.classList.contains("id")))) txt += n.textContent;
  });
  txt = txt.replace(/\u2212/g, "-").trim();
  if (!txt || txt === "\u2014") return null;
  const my = txt.match(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+[\u2019']?(\d{2,4})\b/);
  if (my) return (my[2].length === 2 ? 2000 + Number(my[2]) : Number(my[2])) * 100 + MON3.indexOf(my[1]);
  const m = txt.match(/-?\$?\d[\d,]*(\.\d+)?\s*([KkMm](?![a-z])|%)?/);
  if (!m) return txt.toLowerCase();
  let v = parseFloat(m[0].replace(/[$,\s%KkMm]/g, ""));
  const u = (m[2] || "").toUpperCase();
  if (u === "K") v *= 1e3; else if (u === "M") v *= 1e6;
  return isNaN(v) ? txt.toLowerCase() : v;
}
function cmpCell(a, b){
  if (typeof a === "number" && typeof b === "number") return a - b;
  if (typeof a === "number") return -1;
  if (typeof b === "number") return 1;
  return String(a).localeCompare(String(b));
}
function applySectionSorts(){
  document.querySelectorAll("#sections section.prog[data-sec]").forEach(sec => {
    const key = sec.dataset.sec, table = sec.querySelector(".tbl table");
    if (!table || !table.tHead || !table.tBodies.length) return;
    const ths = [...table.tHead.rows[0].cells], body = table.tBodies[0], rows = [...body.rows];
    const sample = rows.find(r => r.cells.length === ths.length && !r.classList.contains("peer"));
    const st = sSort[key];
    let idx = -1;
    ths.forEach((th, i) => {
      const label = th.textContent.replace(/\s+/g, " ").trim();
      if (!label || (sample && sample.cells[i] && sample.cells[i].querySelector("svg"))) return;
      const on = !!(st && st.col === label);
      if (on) idx = i;
      th.classList.add("sortable");
      th.setAttribute("aria-sort", on ? (st.dir === 1 ? "ascending" : "descending") : "none");
      const hint = on ? "Sorted " + (st.dir === 1 ? "ascending" : "descending") + " \u2014 click to change" : "Click to sort";
      th.innerHTML = `<button type="button" data-ssort="${esc(key)}" data-col="${esc(label)}" data-num="${th.classList.contains("l") ? 0 : 1}" title="${hint}">` +
        `${th.innerHTML}<span class="arr" aria-hidden="true">${on ? (st.dir === 1 ? "\u25b2" : "\u25bc") : "\u2195"}</span></button>`;
    });
    if (idx < 0) return;
    const keyed = rows.filter(r => !r.classList.contains("peer"))
      .map((r, n) => ({r, n, k: r.cells.length === ths.length ? cellKey(r.cells[idx]) : null}));
    keyed.sort((a, b) => {
      if ((a.k === null) !== (b.k === null)) return a.k === null ? 1 : -1;
      return (a.k === null ? 0 : cmpCell(a.k, b.k) * st.dir) || a.n - b.n;
    });
    keyed.forEach(x => body.appendChild(x.r));
    rows.filter(r => r.classList.contains("peer")).forEach(r => body.appendChild(r));
  });
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-ssort]");
  if (!b) return;
  const key = b.dataset.ssort, col = b.dataset.col, first = b.dataset.num === "1" ? -1 : 1, st = sSort[key];
  if (!st || st.col !== col) sSort[key] = {col, dir: first};
  else if (st.dir === first) sSort[key] = {col, dir: -first};
  else delete sSort[key];
  persistSSort(); update();
  const again = [...document.querySelectorAll("[data-ssort]")].find(x => x.dataset.ssort === key && x.dataset.col === col);
  if (again) again.focus();
});

function safe(label, fn){
  try { return fn(); }
  catch (e){
    console.error(label + " failed to render", e);
    return `<section class="prog"><div class="hd"><h2>${label}</h2></div>` +
      `<div class="empty">This section could not be rendered from the data in this build.</div></section>`;
  }
}

function update(){
  persist(); renderChips(); markAllChips(); renderClientFold();
  const vis = clients.filter(c=>inCsm(c) && selClients.has(c.id) && inProducts(c));
  safe("Summary", ()=>renderStrip(vis));
  const secs = document.getElementById("sections");
  const html = [selProgs.has("ARS")?safe("CSM action items",()=>secActions(vis)):"",
                safe("Client overview",()=>secOverview(vis)),
                selProgs.has("ARS")?safe("Account Revenue Solution",()=>secARS(vis)):"",
                selProgs.has("ICS")?safe("Invitation Checking System",()=>secICS(vis)):"",
                selProgs.has("MRPC")?safe("MyRewards Premium Cards",()=>secMRPC(vis)):"",
                selProgs.has("CP")?safe("CashPlease",()=>secCP(vis)):""].join("");
  const why = !selCsms.size ? "No CSM is selected. Pick one above, or click All."
    : !selProgs.size ? "No product is selected. Pick one above, or click All."
    : !selClients.size ? "No client is selected. Pick one above, or click All."
    : "Nothing to show: the selected clients are not on the selected products.";
  secs.innerHTML = html || `<div class="empty">${why}</div>`;
  applySectionSorts();
  document.getElementById("rostersec").innerHTML = safe("Clients and decks", ()=>secRoster(vis));
}
document.getElementById("periodpill").textContent = "Reporting period " + DATA.period.replace(".", " \u00b7 ");
document.getElementById("updated").innerHTML = `<i></i>Last updated ${esc(DATA.generated)}`;
document.getElementById("foot").innerHTML =
  `<p><strong>Where each figure comes from.</strong></p><ul class="prov">` +
  `<li><b>CSM action items</b> - ${esc((DATA.sources && DATA.sources.actions) || "not built in this refresh")}.</li>` +
  `<li><b>Client overview</b> - ${esc((DATA.sources && DATA.sources.overview) || "ODD extracts")}.</li>` +
  `<li><b>Clients</b> - ${esc((DATA.sources && DATA.sources.clients) || "the clients.md roster")}.</li>` +
  `<li><b>CSM</b> \u2014 ${esc((DATA.sources && DATA.sources.csm) || "not resolved in this build")}.</li>` +
  `<li><b>ARS</b> \u2014 ${esc(DATA.sources.ars)}. Executive Financials and All Months Rollup; a row is tagged with its workbook\u2019s period when that is older than the cycle.</li>` +
  `<li><b>ICS</b> \u2014 ${esc(DATA.sources.ics)}. ROI, lifetime value and net profit come from each client\u2019s newest Invitation Checking workbook, flagged when older than the period.</li>` +
  `<li><b>MRPC</b> \u2014 ${esc(DATA.sources.mrpc)}. The weekly supplies take rates, cardholders and monthly enrollments; VIP supplies goal attainment and revenue.</li>` +
  `<li><b>CashPlease</b> \u2014 ${esc(DATA.sources.cp)}, with current clients' own programs as the peer row.</li>` +
  `<li><b>Build readiness</b> \u2014 clients.md for who gets a deck, Inputs/ for what has landed, Outputs/ and Build Artifacts/deliveries.json for built and sent. The CSI shares are not checked here, so readiness reflects what is on this machine.</li>` +
  `<li><b>Mark sent</b> \u2014 records the deck named in the Deck column as sent today, against that deck\u2019s period. It is kept with the page and folded into deliveries.json by the next morning\u2019s refresh, after which it reads as a plain sent date. A client with no built deck cannot be marked.</li>` +
  `<li><b>Undo a send</b> \u2014 click a sent date: it turns into \u201cUndo send?\u201d, and a second click within five seconds removes the record (click anywhere else or press Esc to keep it). The next refresh takes the date out of deliveries.json, but only while it still holds that same date, so an older undo never erases a send recorded after it.</li>` +
  `</ul><p>Program to date is abbreviated PTD. Figures are for reading, not for a deck: the builders remain the source for anything client-facing.</p>`;
update();
</script>
